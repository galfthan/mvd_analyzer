[build]
  # `make bsps` downloads the curated set of Quake 1 BSPs into bsps/
  # (gitignored, see scripts/fetch-bsps.sh). `make build` then copies
  # them into dist/bsps/ so the WASM worker can lazy-fetch per map for
  # the locvis visibility filter. Hard-fails the deploy if any mirror
  # is down — a deploy that silently regresses to V1 attribution would
  # be worse than a red build.
  command = "make bsps && make build"
  publish = "dist"

# Ensure correct MIME type for WASM and enable compression
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    # no-cache = store, but revalidate on every use. index.html, app.js,
    # worker.js and analyzer.wasm deploy as one unit under stable URLs, so a
    # cached copy must be checked against the CDN ETag each time it is used —
    # anything longer-lived leaves mixed old/new versions in people's caches
    # after a deploy. Unchanged assets still answer as cheap 304s. app.js
    # additionally verifies the wasm's embedded git hash against the
    # build-stamped <meta name="build"> in index.html (belt for a deploy
    # landing mid-session) and reloads once on mismatch.
    Cache-Control = "no-cache"
