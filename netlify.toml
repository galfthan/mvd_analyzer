# redirect branch — the Netlify site no longer hosts the app.
# Production moved to mvdanalyzer.com (Caddy serves the web bundle from
# the API host; see deploy/README.md). Point the Netlify site's
# production branch at `redirect` and it publishes only redirect/:
# a static notice page that counts down 5 s and forwards to
# mvdanalyzer.com, preserving the query string so old shared
# ?gameId=… links keep working. No build step, no BSP fetch.
[build]
  command = ""
  publish = "redirect"

# Any old deep URL (stale asset paths, probe.html, …) shows the notice
# too instead of a bare Netlify 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
