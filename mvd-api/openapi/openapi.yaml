                description: "Teammates this player killed (KTX \"tk\")."
                type: integer
            required:
              - kills
              - deaths
              - byWeapon
            type:
              - "null"
              - object
          type:
            - object
            - "null"
        byWeapon:
          description: "Total frags by weapon, keyed by weapon name."
          additionalProperties:
            type: integer
          type:
            - object
            - "null"
        frags:
          description: "Chronological frag-event log."
          items:
            additionalProperties: false
            properties:
              isSuicide:
                description: "Suicide frag."
                type: boolean
              isTeamKill:
                description: "Team-kill frag."
                type: boolean
              killer:
                description: "Killer (attacker) name."
                type: string
              time:
                description: "Event/sample time, int32 ms since match start."
                maximum: 2.147483647e+09
                minimum: -2.147483648e+09
                type: integer
              victim:
                description: "Victim (killed player) name."
                type: string
              weapon:
                description: "Weapon — lowercase KTX class name (sg/ssg/ng/sng/gl/rl/lg)."
                type: string
            required:
              - time
              - killer
              - victim
              - weapon
            type: object
          type:
            - "null"
            - array
        killsMeasured:
          description: |
            Whether kill ATTRIBUTION was observable on this demo at all — the
            demo-global verdict, decided once by the analyzer and stored on
            the Result (schema v65).

            `false` means the frag log is EMPTY on a demo where players
            demonstrably died: every obituary went unmatched because the
            server printed them in a form this pipeline does not parse. Deaths
            still count (they come from the protocol death events, not the
            obituaries), which is exactly what makes the zeros dangerous — a
            row reading `kills: 0, deaths: 92` looks measured. Present
            `kills`, `teamkills` and `byWeapon` as UNMEASURED rather than zero
            when this is false.

            It is DEMO-GLOBAL and survives every filter: narrowing the log by
            `players`/`weapons`/`from`/`to` cannot make a demo's obituaries
            matchable or unmatchable. This is the same verdict `/top-windows`
            and `/lives` publish as `measured.frags`.
          type: boolean
        totalFrags:
          description: "Total frags in the log."
          type: integer
      required:
        # timeUnit is flattened INTO the governed /frags response (always
        # echoed) but carried as an /artifacts envelope SIBLING of the `frags`
        # key (required on that branch, not inside this object), so within this
        # reused schema it stays optional-but-declared.
        - totalFrags
        - frags
        - byWeapon
        - byPlayer
        - killsMeasured
      type: object
    Damage:
      additionalProperties: false
      properties:
        timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        source:
          description: >
            Where the damage log itself came from — `ktx` when decoded from
            the wire's KTX mvdhidden_dmgdone stream (every figure a direct
            measurement), or `reconstructed` when the demo predates that
            instrumentation and the log was rebuilt from the health/armor
            change streams + spectator-visible evidence (LG beams, projectile
            flights, fire sounds, position tracks, the frag log). On
            reconstructed data magnitudes are near-exact but attribution is
            best-effort inference; treat per-player figures as ~1-2%%
            estimates. Absent only on pre-v71 cached results. Distinct from
            `boundedSource`, which records a view-time substitution WITHIN a
            KTX-sourced payload.
          type: string
          enum: [ktx, reconstructed]
        boundedMode:
          description: >
            Whether the bounded family was reconstructed — `standard`, or a
            `skipped:*` reason when the server mode rewrites the take in ways
            the wire does not expose (every bounded field is then absent).
            Survives a raw view. The clan-arena family (`ca`, `wipeout`,
            `ra`), `lgc` and `race` joined the skip set with schema v71 —
            detected from the composite serverinfo `mode` string, the only
            place newer KTX exposes its submodes.
          type: string
          enum: [standard, "skipped:midair", "skipped:instagib", "skipped:dmgfrags",
                 "skipped:ca", "skipped:wipeout", "skipped:ra", "skipped:lgc", "skipped:race"]
        boundedSource:
          description: >
            Where a SUMMARY response's per-player bounded figures came from —
            `ktx` when substituted with KTX's exact end-of-match scoreboard
            totals (demoInfo dmg + weapons[].damage.enemy/.team), else
            `reconstructed`. Present only on an unfiltered summary that serves
            the bounded family (`dmg=bounded` or `dmg=both`); absent on the
            full-log, filtered, and raw responses. NOTE `taken`, the
            enemyVs* buckets and `byWeaponSelf` stay reconstructed even when
            `ktx` (KTX has no matching counter), so the buckets may not sum
            exactly to the substituted `given`; `byWeapon` and `byWeaponTeam`
            both come from KTX's own weapons[].damage sub-block.
          type: string
          enum: [ktx, reconstructed]
        byPlayer:
          description: "Per-player breakdown, keyed by player name."
          additionalProperties:
            additionalProperties: false
            properties:
              bounded:
                description: >
                  The same damage figures under KTX bounded-scoreboard
                  semantics (dmg=both only). A flat nest carrying just the
                  damage-figure fields — no telefrags/stomps/bounded of its
                  own. Absent on a raw view and when the reconstruction was
                  skipped (see boundedMode).
                additionalProperties: false
                properties:
                  byWeapon:
                    description: "Enemy damage by attacker weapon, keyed by weapon name."
                    additionalProperties:
                      type: integer
                    type:
                      - object
                      - "null"
                  byWeaponTeam:
                    description: >
                      Team damage by attacker weapon, keyed like byWeapon.
                      Measured whenever this damage family is present; an
                      absent key means the player dealt no team damage with
                      that weapon, and the whole map is omitted when empty.
                      Telefrags and stomps are excluded, as from byWeapon.
                    additionalProperties:
                      type: integer
                    type: object
                  byWeaponSelf:
                    description: >
                      Self damage by attacker weapon, keyed like byWeapon.
                      Measured whenever this damage family is present; an
                      absent key means the player dealt no self damage with
                      that weapon, and the whole map is omitted when empty.
                      Telefrags and stomps are excluded — their damage folds
                      into givenSelf only.
                    additionalProperties:
                      type: integer
                    type: object
                  enemyVsBoth:
                    description: "Enemy-given damage where the victim held both RL and LG."
                    type: integer
                  enemyVsLg:
                    description: "Enemy-given damage where the victim held LG (not RL)."
                    type: integer
                  enemyVsMid:
                    description: "Enemy-given damage where the victim held ssg/sng/gl, no LG/RL."
                    type: integer
                  enemyVsRl:
                    description: "Enemy-given damage where the victim held RL (not LG)."
                    type: integer
                  enemyVsSg:
                    description: "Enemy-given damage where the victim held shotgun-tier only."
                    type: integer
                  ewep:
                    description: "Effective weapon (most kills with)."
                    type: integer
                  given:
                    description: "Damage given to enemies (the \"useful\" number; KTX dmg.given)."
                    type: integer
                  givenSelf:
                    description: "Self damage (attacker == victim)."
                    type: integer
                  givenTeam:
                    description: "Damage given to teammates."
                    type: integer
                  taken:
                    description: "Damage taken from all sources (enemy + team + self + env)."
                    type: integer
                  takenEnv:
                    description: "Damage taken from world / environment."
                    type: integer
                required:
                  - given
                  - taken
                  - givenTeam
                  - givenSelf
                  - takenEnv
                  - byWeapon
                  - enemyVsSg
                  - enemyVsMid
                  - enemyVsLg
                  - enemyVsRl
                  - enemyVsBoth
                  - ewep
                type: object
              byWeapon:
                description: "Enemy damage by attacker weapon, keyed by weapon name."
                additionalProperties:
                  type: integer
                type:
                  - object
                  - "null"
              byWeaponTeam:
                description: >
                  Team damage by attacker weapon, keyed like byWeapon.
                  Measured whenever this damage family is present; an absent
                  key means the player dealt no team damage with that weapon,
                  and the whole map is omitted when empty. Telefrags and
                  stomps are excluded, as they are from byWeapon.
                additionalProperties:
                  type: integer
                type: object
              byWeaponSelf:
                description: >
                  Self damage by attacker weapon, keyed like byWeapon.
                  Measured whenever this damage family is present; an absent
                  key means the player dealt no self damage with that weapon,
                  and the whole map is omitted when empty. Telefrags and
                  stomps are excluded — their damage folds into givenSelf
                  only.
                additionalProperties:
                  type: integer
                type: object
              enemyVsBoth:
                description: "Enemy-given damage where the victim held both RL and LG."
                type: integer
              enemyVsLg:
                description: "Enemy-given damage where the victim held LG (not RL)."
                type: integer
              enemyVsMid:
