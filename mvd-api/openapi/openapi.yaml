                description: "Type-specific detail fields for this event."
                type: object
                additionalProperties: true
                properties:
                  team: { type: string, description: "Team name." }
                  delta: { type: integer, description: frag delta (frag) or value change (health/armor) }
                  value: { type: integer, description: new value (health/armor/loc index) }
                  bounded: { type: integer, description: KTX-scoreboard bounded value — on damage events the stored per-hit reconstruction (present only when it differs from the raw damage), on telefrag/stomp events the reconstructed kill value; absent when the bounded reconstruction was skipped; 0 is a real value }
                  powerup: { type: string, description: "Powerup type." }
                  endTime: { type: integer, description: int32 ms (powerup/streak) }
                  frags: { type: integer, description: frags during the powerup run }
                  length: { type: integer, description: streak length }
                  duration: { type: integer, description: streak duration, int32 ms }
