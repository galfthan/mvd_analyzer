                additionalProperties: false
                properties:
                  vx:
                    description: "Velocity X, Quake units per second."
                    type: number
                  vy:
                    description: "Velocity Y, Quake units per second."
                    type: number
                  vz:
                    description: "Velocity Z, Quake units per second."
                    type: number
                required:
                  - vx
                  - vy
                  - vz
                type:
                  - "null"
                  - object
              view:
                additionalProperties: false
                description: View direction at the instant (raw angle16 shorts).
                properties:
                  vp:
                    description: view pitch, raw angle16 wire short — degrees = ((v mod 65536) + 65536) mod 65536 x 360 / 65536 (>180 = looking up); contrast /aim's float-degree dpitch.
                    maximum: 32767
