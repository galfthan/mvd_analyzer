    PlayerStats:
      description: >
        Canonical per-player and per-team statistics, computed for EVERY
        demo. Each stat family carries `src` ("derived" | "ktx", plus "derived:unbounded" on damage and the "mixed" team-row canary) naming
        where its numbers came from; `sources` is the roll-up. /demoinfo
        remains the verbatim KTX pass-through this is diffable against.
      additionalProperties: false
      properties:
        timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        players:
          description: "One row per participant."
          items: { $ref: "#/components/schemas/PlayerStatsRow" }
          type: array
        teams:
          description: "Per-team aggregate rows; omitted on duels and FFA."
          items: { $ref: "#/components/schemas/PlayerStatsRow" }
          type: array
        sources:
          description: >
            Per-family provenance roll-up, computed FROM THE ROWS this
            response carries, after any filtering: all rows agree -> that
            value, no row carries the family -> the key is omitted, rows
            disagree -> "mixed". Exception: score and hold are constants
            ("derived") whenever players are present — no overlay ever
            supplies either family. "mixed" is a canary and should never appear
            on healthy data — on a demo with a KTX block every roster row
            joins it, so a disagreement means a row the block has never
            heard of.
          additionalProperties: false
          properties:
            score: { description: "Provenance of the scoreboard family — a constant: the kill side is always the frag-log reconstruction.", type: string, enum: [derived] }
            damage: { description: "Provenance of the damage family. \"derived:unbounded\" means raw wire damage — see the per-row damage.src.", type: string, enum: [derived, "derived:unbounded", ktx, mixed] }
            accuracy: { description: "Provenance of the accuracy family: ktx when the demoinfo block carries it, else the fire-stream reconstruction. The two are different measurements — see the per-row accuracy description.", type: string, enum: [derived, ktx, mixed] }
            pickups: { description: "Provenance of the pickup tallies.", type: string, enum: [derived, ktx, mixed] }
            hold: { description: "Provenance of the possession-time family — a constant: no other source carries it.", type: string, enum: [derived] }
          required: [score, hold]
          type: object
      required:
        - players
        - sources
      type: object
    PlayerStatsRow:
      description: >
        One player's canonical statistics. On a team row `name` is the team
        name and `team` / `ping` / `handicap` / `login` / `bot` are absent.
      additionalProperties: false
      properties:
        name: { description: "Player name, or team name on a team row.", type: string }
        team: { description: "Team name.", type: string }
        identity:
          description: |
            Reconnect-unification key: two rows carrying the SAME value are
            one human under two names — a player who reconnected while their
            old connection was still spawned is renamed `(N)<name>` by mvdsv
            and scored as two players by KTX, which this pipeline reproduces
            faithfully rather than merging. Different values are different
            humans as the server scored them.

            **Demo-local.** It is derived from the identity's first session
            (`s<slot>u<userId>`), both of which describe a connection to one
            server. Reproducible from the same demo, but NOT an id to persist
            and NOT comparable across demos — the cross-demo identity is
            `login`.

            Absent on TEAM rows and on a scoreboard-only player row (in the
            KTX block, produced no stream, so no occupancy to attribute).
          type: string
        sessions:
          description: |
            Every wire-slot occupancy behind this row, in time order — one
            entry per CONNECTION, so a player who timed out and rejoined has
            two, with two userids. This is the lossless form of the answer
            `/overview`'s `playerUserIDs` gives once per player: use `userId`
            for a `?track=` link at an instant inside the window. Absent with
            `identity` (team and scoreboard-only rows).

            **What is NOT listed:**

            - Occupancies the wire never gave a userid — KTX's ghost
              scoreboard row (a departed player's edict, userid hardcoded 0)
              and inferred occupancies are not connections, and the ghost
              carries the departed player's name.
            - A connection first attested at or after match end (a spectator
              connecting postgame, unified with a player who left mid-match):
              the published window closes at match end, so it would emit
              startMs > endMs, and it describes nothing trackable inside the
              match.
          items: { $ref: "#/components/schemas/PlayerSession" }
          type: array
        ping:
          description: "KTX-only: end-of-match ping. Absent without a demoinfo block (svc_updateping carries it on the wire but the parser skips it today)."
          type: [integer, "null"]
        handicap:
          description: "KTX-only: handicap, omitted by KTX at the default 100."
          type: [integer, "null"]
        login:
          description: "Authenticated login name: KTX's when present, else the *auth userinfo key off the wire."
          type: [string, "null"]
        bot:
          description: "KTX-only: present when the slot was held by a frogbot."
          oneOf:
            - additionalProperties: false
              properties:
                skill: { description: "Frogbot skill level.", type: integer }
                customised: { description: "True when the bot's settings were customised.", type: boolean }
              required: [skill, customised]
              type: object
            - type: "null"
        controlMs:
          description: "KTX-only: KTX's own map-control time in milliseconds. Not the same measure as the region-control view, and absent without a demoinfo block."
          type: integer
        speed:
          description: "KTX-only: per-player speed summary in Quake units per second. Absent without a demoinfo block."
          oneOf:
            - additionalProperties: false
              properties:
                max: { description: "Peak speed observed.", type: number }
                avg: { description: "Average speed.", type: number }
              required: [max, avg]
              type: object
            - type: "null"
        members:
          description: "TEAM rows only, and ALWAYS present there (including 0): how many players were folded in that were actually in the match (presentMs > 0) — exactly the count shareMatch's denominator (matchMs x members) rests on. A scoreboard-only row is summed into the team's totals but does not count here. Absent on player rows."
          type: integer
        window: { $ref: "#/components/schemas/PlayerStatsWindow" }
        score:
          description: >
            Scoreboard line. Always derived — the KTX stats over-count
            telefrags and reset after a reconnect. The KILL SIDE (kills,
            suicides, teamKills, byWeapon, efficiency) is OPTIONAL: it is
            attributed from the obituary-derived frag log, and on a demo
            whose obituaries never matched, all five are absent together
            rather than served as zeros beside a real death count. `frags`
            (the wire net score) and `deaths` (protocol death events) are
            measured on every demo and always present.
          additionalProperties: false
          properties:
            src: { description: "Provenance of this family — a constant \"derived\": the kill side is always the frag-log reconstruction.", type: string, enum: [derived] }
            frags: { description: "svc_updatefrags net score.", type: integer }
            kills: { description: "Frag-log-corrected kills. ABSENT when the frag log measured nothing on a demo where players died — kill attribution was not observable.", type: integer }
            deaths: { description: "Frag-log-corrected deaths.", type: integer }
            suicides: { description: "Frag-log-corrected suicides (KTX credits world-dealt ones to the world entity). Absent with `kills`.", type: integer }
            teamKills: { description: "Teammates this player killed. Absent with `kills`.", type: integer }
            efficiency:
              description: "kills / (kills + deaths) as a RATIO in [0,1], not a percentage. Absent with `kills`, since it is computed from it."
              type: number
            byWeapon:
              description: >
                Enemy kills split by the weapon that dealt them, commonly rl/lg/gl/sg/ssg/sng/ng/axe.
                The key set is the frag log's obituary vocabulary, which ALSO includes the
                non-weapon killers `tele`, `stomp` and `squish`, the catch-all `unknown` for a
                generic "was killed by" line, and `hook`/`rail` on mods that have them — `tele`
                appears in the committed corpus. Iterate the map; do not assume a fixed key list.
                From the corrected frag log, so it is on the same footing as `kills` — absent with
                it — and is never overlaid with KTX's per-weapon counts. Weapons the player never
                killed with are omitted, not zero-filled.
              additionalProperties: { type: integer }
              type: object
            byEnemyWeapon:
              description: >
                The SAME enemy kills split by what the VICTIM was holding when they died — the
                other axis from byWeapon, which keys on the weapon the KILLER used. This is the
                weapon-denial figure: "how many armed enemies did this player take out".

                Buckets are MUTUALLY EXCLUSIVE and PARTITION `kills`: `both` (victim held RL and
                LG), `rl` (RL, not LG), `lg` (LG, not RL), `mid` (ssg/sng/gl only), `sg` (nothing
                above the shotgun tier — the respawn loadout), and `unknown` (the victim produced
                no possession stream, so their loadout is unknowable). Enemies killed while
                holding an RL is therefore `rl + both`, NEVER `rl` alone; likewise `lg + both`.
                Those two overlap in `both` by construction, so adding them double-counts the
                fully armed victims.

                DERIVED on every demo carrying streams and never overlaid with KTX's `ekills`,
                which counts the same events INCLUSIVELY (a victim holding RL+LG bumps both
                counters) and is force-zeroed for axe/sg and for every bucket on `deathmatch >= 4`
                and `k_instagib`. Where KTX measures honestly the two agree exactly:
                `rl + both == ktx ekills.rl`, verified across the cached demo corpus. Unlike KTX's, this
                also classifies telefrags and stomps. On the same footing as `kills` — absent with
                it. Zero buckets are omitted.
              additionalProperties: { type: integer }
              type: object
            byWeaponVsEnemyWeapon:
              description: >
                The JOINT distribution byWeapon and byEnemyWeapon are the marginals of:
                killer weapon -> victim-weapon bucket -> kills. Outer keys are byWeapon's
                vocabulary, inner keys byEnemyWeapon's. Use it for what neither marginal can
                answer — "how many of my LG kills were against enemies carrying an RL", the
                question separating a weapon that wins fights from one that finishes off the
                disarmed.

                Summing it reproduces both maps EXACTLY: over inner keys it gives byWeapon,
                over outer keys byEnemyWeapon. That is guaranteed by construction (the marginal
                is summed from this table, not tallied separately), so the three maps can never
                disagree. Same measuredness as its marginals — absent exactly when `kills` is —
                and the same zero-dropping. This is the widest map in the response (up to
                weapons-used x 6); skip it when a scoreboard is all you need.
              additionalProperties:
                additionalProperties: { type: integer }
                type: object
              type: object
          required: [src, frags, deaths]
          type: object
        damage:
          description: "Damage under KTX bounded-scoreboard semantics. Absent when the demo carries no damage information at all — but a player who neither dealt nor took a point of damage on a demo that DOES carry the stream gets a zeroed family, since that is an observed zero rather than an unmeasurable one."
          oneOf:
            - additionalProperties: false
              properties:
                src:
                  description: >
                    Provenance of this family. "derived:unbounded" means the
                    numbers are RAW wire damage including overkill, because the
                    server mode (k_midair / k_instagib / k_dmgfrags) rewrites
                    T_Damage in ways the wire does not expose and no bounded
                    reconstruction was attempted — the same condition
                    /damage reports as boundedMode "skipped:*". Raw runs
                    38-44% above bounded on a normal 4on4 and an order of
                    magnitude on instagib's flat 5000/hit, so do not compare
                    these figures with a bounded demo's.
                  type: string
                  enum: [derived, "derived:unbounded", ktx, mixed]
                given: { description: "Dealt to enemies.", type: integer }
                givenTeam: { description: "Dealt to teammates.", type: integer }
                givenSelf: { description: "Dealt to self.", type: integer }
                enemyWeapons: { description: "Enemy damage dealt to victims holding RL and/or LG (KTX ewep).", type: integer }
                taken:
                  description: >
                    From ALL sources (enemy + team + self + env) — NOT the same
                    quantity as KTX dmg.taken. Only the per-hit reconstruction
                    measures it, so it is ABSENT (not zero) on a demo that
                    carries a KTX block but no damage stream.
                  type: integer
                teamWeapons:
                  description: "KTX-only: damage dealt to TEAMMATES holding RL and/or LG (KTX twep) — the friendly-fire mirror of enemyWeapons. The reconstruction does not bucket team damage by the victim's inventory, so this is absent without a demoinfo block."
                  type: integer
                byWeapon:
                  description: >
                    Enemy damage GIVEN split by the attacker's weapon, keyed rl/lg/gl/sg/ssg/sng/ng/axe
                    plus the non-KTX residual keys unknown/stomp/tele/squish/explobox, which are real
                    measured damage the reconstruction contributes (the full vocabulary is
                    `DeathTypeToWeapon`; iterate the map). Follows src with the family: KTX's per-weapon
                    enemy damage wherever the block carries a `damage` sub-block — including an
                    `enemy: 0` there, which is a MEASURED zero (a weapon used for team splash only) —
                    else the bounded reconstruction. Weapons the player dealt no damage with are
                    omitted. There is no by-weapon split of damage TAKEN on either side.
                  additionalProperties: { type: integer }
                  type: object
                byWeaponTeam:
                  description: >
                    TEAM damage GIVEN split by the attacker's weapon, keyed exactly like byWeapon.
                    Follows src with the family: KTX writes `enemy` and `team` in the same
                    `damage` sub-block, so it is merged on the same presence rule and a `team: 0`
                    there is a MEASURED zero. MEASURED whenever this damage family is present.
                    Weapons the player dealt no team damage with are omitted.
                  additionalProperties: { type: integer }
                  type: object
                byWeaponSelf:
                  description: >
                    SELF damage GIVEN split by the attacker's weapon, keyed exactly like byWeapon.
                    Derived-only — KTX records no per-weapon self counter — so it is MEASURED only
                    where a damage stream was read, which is exactly what a present `taken` says:
                    absent on a demo with a KTX block but no damage stream, whatever the player did.
                    Weapons the player dealt no self damage with are omitted. Telefrags and stomps
                    are excluded — their damage folds into givenSelf only.
                  additionalProperties: { type: integer }
                  type: object
                byEnemyWeapon:
                  description: >
                    ENEMY damage GIVEN split by what the VICTIM was holding when each hit landed —
                    the other axis from byWeapon, which keys on the ATTACKER's weapon. Buckets are
                    MUTUALLY EXCLUSIVE: `both` (victim held RL and LG), `rl`
                    (RL, not LG), `lg` (LG, not RL), `mid` (ssg/sng/gl only), `sg` (nothing above
                    the shotgun tier). Damage into enemies holding an RL is therefore `rl + both`,
                    NEVER `rl` alone. `enemyWeapons` above is exactly `lg + rl + both`.

                    They partition the enemy damage THIS PIPELINE RECONSTRUCTED, which equals
                    `given` exactly on a `src: derived` row but NOT on a `src: ktx` one — there
                    `given` is KTX's own counter while this split stays ours, since KTX records no
                    per-tier equivalent. Measured residual across the corpus: 66 of 82 KTX rows,
                    worst 16 damage, 0.03% of total given. Do not expect a share-of-given computed
                    from these buckets to reach exactly 100% on a KTX row. The KILL-side sibling
                    `score.byEnemyWeapon` has no such gap — score is never overlaid.

                    DERIVED-only and finer than the server's own accounting — KTX keeps a single
                    dmg_eweapon scalar lumping RL and LG together — so it is MEASURED only where a
                    damage stream was read, which is exactly what a present `taken` says: absent on
                    a demo with a KTX block but no damage stream. Zero buckets are omitted.
                    Telefrags and stomps are excluded, as everywhere in this family.
                  additionalProperties: { type: integer }
                  type: object
                takenEnemy:
                  description: "Enemy-only damage taken (KTX dmg.taken). KTX's when present, else reconstructed from the per-hit log. Absent, not zero, when the demo carries no damage information."
                  type: integer
                takenToDie:
                  description: "Average damage absorbed per death (takenEnemy / deaths). Absent when the player never died — KTX's 99999 no-deaths sentinel is never served as a number."
                  type: integer
              required: [src, given, givenTeam, givenSelf, enemyWeapons]
              type: object
            - type: "null"
        accuracy:
          description: |
            Per-weapon shot accounting. Two sources:

            - **src=ktx** is KTX's server-side counter (attacks = PELLETS for
              sg/ssg, with a real/virtual split);
            - **src=derived** is reconstructed from the decoded fire stream
              (attacks = TRIGGER PULLS, no real/virtual, and hits absent when
              the demo has no damage stream to link against).

            The two are NOT the same measurement, so check src before
            comparing accuracies across demos — but the family is emitted
            either way, so a demo with no KTX block degrades to a rougher
            number rather than to a missing field.

            When KTX carries an acc block the family is replaced WHOLESALE,
            never merged per weapon: mixing pellet counts with trigger pulls
            in one map under one src is the coercion this section exists to
            avoid. Measured lossless across the 42-demo cached corpus (228
            rows, zero weapons present in the reconstruction and missing from
            KTX).
          oneOf:
            - additionalProperties: false
              properties:
                src: { description: "Provenance of this family: the members' shared source on a team row, or \"mixed\" — the phantom-roster canary — when they disagree. Player rows never carry \"mixed\".", type: string, enum: [derived, ktx, mixed] }
                byWeapon:
                  description: "Per weapon key (axe, sg, ssg, ng, sng, gl, rl, lg — KTX counts axe swings too). What the numbers mean depends on src — see the family description."
                  additionalProperties:
                    additionalProperties: false
                    properties:
                      attacks: { description: "PELLETS when src=ktx and the weapon is sg/ssg; TRIGGER PULLS otherwise.", type: integer }
                      hits: { description: "Hits landed. ABSENT (not zero) on a derived block when the demo has no damage stream to link fires against — a zero would read as 'shot and never hit'. On a TEAM row, absent unless every contributing member measured it.", type: integer }
                      real: { description: "Not aggregated on team rows (KTX omits the pair unless it recorded one). KTX-only, rl/gl only: victims who actually lost health or armor to a blast — one rocket splashing three players counts three. NOT a split of hits (which for rl/gl is the direct-impact count), and routinely larger than it.", type: integer }
                      virtual: { description: "KTX-only, rl/gl only: victims who WOULD have been damaged, measured before godmode / pentagram / teamplay damage-avoidance zeroed it out. Always >= real; the gap is damage prevented, not missed.", type: integer }
                    required: [attacks]
                    type: object
                  type: object
              required: [src, byWeapon]
              type: object
            - type: "null"
        pickups:
          description: "Per-kind pickup tallies, keyed by this repo's item-kind vocabulary (ra/ya/ga/mh/quad/rl/lg/…), not KTX's demoinfo keys."
          oneOf:
            - additionalProperties: false
              properties:
                src: { description: "Provenance of this family: the members' shared source on a team row, or \"mixed\" — the phantom-roster canary — when they disagree. Player rows never carry \"mixed\".", type: string, enum: [derived, ktx, mixed] }
                byKind:
                  description: >
                    Tally per item kind. With src=ktx the key set can additionally include
                    `axe` and `sg`, which KTX counts (its WpName vocabulary, ktx/src/stats.c:358)
                    and the derived path never emits — so the KEY SET depends on src, not just
                    the values. Iterate the map; do not assume a fixed key list.
                  additionalProperties: { $ref: "#/components/schemas/PlayerStatsPickup" }
                  type: object
              required: [src, byKind]
              type: object
            - type: "null"
        hold:
          description: "Possession time by item — the family no other source carries."
          additionalProperties: false
          properties:
            src: { description: "Provenance of this family — a constant: no other source carries it.", type: string, enum: [derived] }
            weapons:
              description: "Keyed rl/lg/gl/ssg/sng. Shotgun and axe are deliberately absent (held all match by everyone); the nailgun is absent because the streams track no NG possession interval."
              additionalProperties: { $ref: "#/components/schemas/HoldStat" }
              type: object
            armor:
              description: "Keyed ra/ya/ga plus `none`, the alive-time complement. ga+ya+ra+none == window.aliveMs."
              additionalProperties: { $ref: "#/components/schemas/HoldStat" }
              type: object
            powerups:
              description: "Keyed quad/pent/ring."
              additionalProperties: { $ref: "#/components/schemas/HoldStat" }
              type: object
          required: [src]
          type: object
      required:
        - name
        - window
        - score
        - hold
      type: object
    PlayerSession:
      description: >
        One contiguous occupancy of a wire client slot by ONE connection of
        this player — the validity window of a userid. A userid names a
        connection, not a person (mvdsv reissues them from a rotating pool),
        so the same human reconnecting draws a new one and the slot they left
        hands its old one to whoever takes it next.
      additionalProperties: false
      properties:
        startMs:
          description: >
            First userinfo that attested this connection, int32 ms on the
            match clock. NOT clamped to the match window: a player connected
            during the countdown reports a NEGATIVE value, the same policy as
            the timeline's demo markers and the pause anchors.
          maximum: 2.147483647e+09
          minimum: -2.147483648e+09
          type: integer
        endMs:
          description: >
            The drop broadcast, or the next connection's userinfo — half-open
            [startMs, endMs). Synthetic in TWO cases, both reading exactly
            match end: a client still connected when the recording ended (no
            wire event exists to report), and a drop broadcast that lands
            AFTER match end (the event exists, but the window is closed on
            the match clock every other time here lives on). So an endMs at
            match end does not by itself mean "still connected at the end".
          maximum: 2.147483647e+09
          minimum: -2.147483648e+09
          type: integer
        slot:
          description: "Wire client slot (0-based), the index svc_* messages address this connection by."
          type: integer
        userId:
          description: "The connection's userid — the value a hub `?track=` link must carry to follow this player inside this window, and only then. Always non-zero: an occupancy the wire gave no userid is not published as a session at all, so there is no 0 to interpret."
          type: integer
        name:
          description: >
            The netname this connection carried, where the row's `name` is
            the identity's canonical one. They differ after a rename or an
            mvdsv `(N)` duplicate-name prefix; this is the one to match
            against a live engine roster at an instant inside the window.
            Normalized through the same Quake character fold as every other
            name in this API, so it is not the raw wire bytes.
          type: string
      required: [startMs, endMs, slot, userId]
      type: object
    PlayerStatsWindow:
      description: >
        The denominators every rate in the row can be read against, int32 ms
        on the game clock (pauses already excluded). Nothing here has an
        implicit denominator.
      additionalProperties: false
      properties:
        matchMs:
          description: "The whole match window. Identical on every row."
          maximum: 2.147483647e+09
          minimum: -2.147483648e+09
          type: integer
        presentMs:
          description: "First to last activity, clipped to the match — separates a late joiner from someone present the whole time."
          maximum: 2.147483647e+09
          minimum: -2.147483648e+09
          type: integer
        aliveMs:
          description: "Time alive within presentMs."
          maximum: 2.147483647e+09
          minimum: -2.147483648e+09
          type: integer
        deadMs:
          description: "presentMs - aliveMs."
          maximum: 2.147483647e+09
          minimum: -2.147483648e+09
          type: integer
      required: [matchMs, presentMs, aliveMs, deadMs]
      type: object
    PlayerStatsPickup:
      description: "One item kind's tally for one player."
      additionalProperties: false
      properties:
        took:
          description: "Acquisitions that granted the item — for weapons, pickups where the player did not already hold it (KTX wpn.tooks)."
          type: integer
        totalTook:
          description: "Every touch including redundant ones (KTX wpn.ttooks). Weapons only."
          type: integer
        dropped:
          description: "Backpacks left on death carrying this weapon."
          type: integer
        xfer:
          description: >
            Pack transfers credited to this player AS THE DROPPER: a pack they
            dropped that a teammate took. ABSENT (not zero) when the demo
            carries no backpack hints, i.e. transfers are unobservable.
            Teamplay-only, like KTX's isTeam() gate.
          type: integer
        xferSelf:
          description: >
            Same, but the dropper took their own pack back. KTX's xferRL/xferLG
            is xfer + xferSelf — it has no other!=dropper check.
          type: integer
      type: object
    HoldStat:
      description: "One item's possession time for one player (or team)."
      additionalProperties: false
      properties:
        ms:
          description: "Possession time: an exact integral over native-rate possession intervals, clipped to the match window and intersected with alive intervals."
          maximum: 2.147483647e+09
          minimum: -2.147483648e+09
          type: integer
        runs:
          description: "Number of disjoint possession spells (summed over members on a team row)."
          type: integer
        longestMs:
          description: "Longest single spell (MAX over members on a team row, not summed)."
          maximum: 2.147483647e+09
          minimum: -2.147483648e+09
          type: integer
        shareAlive:
          description: "ms / window.aliveMs, a ratio in [0,1]. On a team row the denominator is the team's summed alive time."
          type: number
        shareMatch:
          description: "ms / window.matchMs, a ratio in [0,1]. On a team row the denominator is matchMs x member count."
          type: number
      required: [ms, runs, longestMs, shareAlive, shareMatch]
      type: object
    Events:
      type: object
      description: >
        /events body — a flat, time-ordered event list. detail keys vary
        by event type (the well-known keys are typed below and validated
        when present); detail is omitted for spawn/death without a loc
        sample. Event types: airgib, armor, chat, damage, death, demomark,
        frag, health, item, loc, pause, pickup, powerup, spawn, stomp,
        streak, telefrag, weapon.
      required: [timeUnit, events]
      additionalProperties: false
      properties:
        timeUnit: { type: string, enum: [ms], description: "Constant \"ms\" self-description echo — in the v57 pure-ms model every time value is int32 milliseconds." }
        events:
          description: "Tagged event list ([] when nothing matches)."
          type: array
          items:
            type: object
            required: [time, type]
            additionalProperties: false
            properties:
              time:
                type: integer
                description: Match-relative time, int32 ms.
              type: { type: string, description: "Type discriminator." }
              player: { type: string, description: "Player display name." }
              detail:
                description: "Type-specific detail fields for this event."
                type: object
                additionalProperties: true
                properties:
                  team: { type: string, description: "Team name." }
                  delta: { type: integer, description: frag delta (frag) or value change (health/armor) }
                  value: { type: integer, description: new value (health/armor/loc index) }
                  bounded: { type: integer, description: KTX-scoreboard bounded value — on damage events the stored per-hit reconstruction (present only when it differs from the raw damage), on telefrag/stomp events the reconstructed kill value; absent when the bounded reconstruction was skipped; 0 is a real value }
                  powerup: { type: string, description: "Powerup type." }
                  endTime: { type: integer, description: int32 ms (powerup/streak) }
                  frags: { type: integer, description: frags during the powerup run }
                  length: { type: integer, description: streak length }
                  duration: { type: integer, description: streak duration, int32 ms }
                  weapon: { type: string, description: "Weapon — lowercase KTX class name (sg/ssg/ng/sng/gl/rl/lg)." }
                  victim: { type: string, description: "Victim (killed player) name." }
                  damage: { type: integer, description: "Raw/unbound wire damage amount, including overkill (see bounded for the KTX-scoreboard value)." }
                  isSplash: { type: boolean, description: "Indirect hit (e.g. rocket splash)." }
                  isEnv: { type: boolean, description: "Environmental / world-sourced." }
                  isSelf: { type: boolean, description: "Attacker == victim." }
                  isTeam: { type: boolean, description: "Same team, not self." }
                  victimWep: { type: string, description: "Victim weapon class at hit time (sg|mid|lg|rl|both)." }
                  gain: { type: string, description: weapon/item code gained (interval start) }
                  lose: { type: string, description: weapon/item code lost (interval end) }
                  item: { type: string, description: spawner instance name (pickup), e.g. ya_1 }
                  kind: { type: string, description: "Item kind — compact vocabulary (rl/lg/ra/mh/quad/…)." }
                  entNum: { type: integer, description: "Server entity/edict number — stable id within a match." }
                  source:
                    description: "Source."
                    type: string
                    enum: [world, backpack, unknown]
                  dropper: { type: string, description: "Backpack dropper name." }
                  loc: { type: string, description: "Nearest named location from the map .loc file." }
                  li: { type: integer, description: raw LocTable index (loc=index mode) }
                  text: { type: string, description: chat message }
                  clean: { type: string, description: chat message, color codes stripped }
                  attackerTeam: { type: string, description: "airgib attacker (rocketeer) team." }
                  victimTeam: { type: string, description: "airgib victim team." }
                  height: { type: number, description: "airgib victim feet above the floor at the hit (units)." }
                  heightAboveAttacker: { type: number, description: "airgib victim origin minus shooter origin at the hit (units; negative = victim below shooter); omitted when 0." }
                  lethal: { type: boolean, description: "airgib hit killed the victim (matching rocket frag near the hit)." }
                  durationMs: { type: integer, description: "pause real wall-clock ms consumed (pause events)." }
    BucketsRow:
      additionalProperties: false
      properties:
        timeUnit: { type: string, enum: [ms], description: "Constant \"ms\" self-description echo — in the v57 pure-ms model every time value is int32 milliseconds." }
        buckets:
          description: "Per-window bucket rows."
          items:
            additionalProperties: false
            properties:
              p:
                description: "Per-player reduced values, keyed by player name."
                additionalProperties:
                  additionalProperties: true
                  type: object
                type:
                  - object
                  - "null"
              partial:
                description: "This bucket is a short trailing window."
                type: boolean
              time:
                type: integer
                description: Bucket start, int32 ms.
              team:
                description: "Per-team reduced values, keyed by team name."
                additionalProperties:
                  additionalProperties: true
                  type: object
                type: object
            required:
              - time
              - p
            type: object
          type:
            - "null"
            - array
        windowMs:
          description: "Bucket width, int32 ms."
          type: integer
      required:
        - timeUnit
        - windowMs
        - buckets
      type: object
    BucketsColumnar:
      type: object
      description: >
        Column-major buckets (layout=column, the default). The time axis is
        implicit: time(i) = start + i*windowMs (int32 ms). Each player
        object inlines its dense columns at the top level keyed by field
        code; boolean columns (and the alive mask) serialize as 0/1.
      required: [timeUnit, windowMs, start, count]
      additionalProperties: false
      properties:
        timeUnit: { type: string, enum: [ms], description: "Constant \"ms\" self-description echo — in the v57 pure-ms model every time value is int32 milliseconds." }
        windowMs: { type: integer, description: "Bucket width, int32 ms." }
        start: { type: integer, description: First bucket start, int32 ms. }
        count: { type: integer, description: "Number of buckets." }
        partialLastMs:
          type: integer
          description: Shorter end of the final bucket when the match length is not a multiple of windowMs.
        locTable:
          type: array
          description: >
            Legend for the raw li columns — the demo's interned loc-name
            table (index 0 is the "" no-loc sentinel; identical to
            /loc-table). Present iff an li column is in the output, so
            columnar responses decode locally without a /loc-table call
            (v53).
          items: { type: string }
        players:
          description: "Per-player columnar bucket series, keyed by player name."
          type: object
          additionalProperties:
            type: object
            description: >
              One player's dense columns over their active span
              [first, first+n). Reserved keys first/n/alive/validFrom;
              every other key is a requested field-code column (or a
              position/view sub-column like x/y/z, vp/vya, vx/vy/vz) of
              length n — numeric, string (at), or 0/1 series.
            required: [first, n, alive]
            properties:
              first: { type: integer, description: "Index of the first populated column." }
              n: { type: integer, description: "Per-column sample counts." }
              alive:
                description: "Per-column alive flags."
                type: array
                items: { type: integer, minimum: 0, maximum: 1 }
              validFrom:
                type: object
                description: >
                  Absolute bucket index from which a late-starting column
                  is valid; leading slots hold a typed zero and must be
                  treated as absent.
                additionalProperties: { type: integer }
            additionalProperties:
              type: array
              items:
                type: [number, string]
        teams:
          description: "Per-team columnar bucket series, keyed by team name."
          type: object
          additionalProperties:
            type: object
            description: >
              One team's per-bucket aggregate counters as dense integer
              columns of length count, keyed by counter name; armor-by-type
              sub-columns nest under abt.
            properties:
              abt:
                description: "Per-column armed-both-teams flags."
                type: object
                additionalProperties:
                  type: array
                  items: { type: integer }
            additionalProperties:
              type: array
              items: { type: integer }
    StreamSlice:
