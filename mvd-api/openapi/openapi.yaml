# mvd-api — OpenAPI 3.1 description of the REST surface.
#
# FORMATTING IS LOAD-BEARING. mvd-api/openapi_test.go scans this file
# line-wise:
#   - path items are "  /path:" (2-space indent), methods "    get:" (4-space);
#   - the marker comments (artifact-enum, error-code-enum, field-code-enum,
#     event-type-enum, top-window-metric-enum) delimit enum blocks pinned to
#     the code — each names the test that pins it, and a block whose lines
#     are not all "- value" fails the parser;
#   - info.version must equal result.CurrentSchemaVersion.
# Keep those conventions when editing, or the drift tests will fail loudly.
#
# This file is THE per-endpoint reference and must stay self-contained:
# it is served to external integrators who cannot follow repo-relative
# file references, so inline semantics here rather than pointing at
# API.md (high-level guide + recipes only). Deep Result internals may
# link to /docs/result-schema — RESULT_SCHEMA.md served by this API.
# Response shapes are authored from the view/result structs and are
# validated against real golden-corpus responses by openapi_validate_test.go.
openapi: 3.1.0
info:
  title: mvdanalyzer-api
  version: "71"
  summary: QuakeWorld MVD demo analysis REST API
  description: |
    REST host for the mvd-analyzer pipeline: point it at a demo
    (`gameId:N` from hub.quakeworld.nu, or `sha:HEX` of the demo file) and
    read curated analysis sections — frags, damage, aim, item timelines,
    positional streams — as JSON.

    ### Time units — one rule
    **All times are int32 milliseconds** — request params and response
    fields, REST and MCP alike. The time-valued query params `from` / `to`
    / `time` are **integer milliseconds**; a non-integer value (e.g.
    `from=10.5`) 400s with code `invalid_param` and an `(integer
    milliseconds)` hint rather than misfiltering. Every response time field
    is int32 ms — but two key spellings share that one unit, by a
    dense/sparse rule: sample-rate-scaled arrays use the terse key `t`
    (stream tracks, aim samples, projectile/beam columns); the columnar
    bucket grid carries no time key at all — its axis is implicit
    (`time(i) = start + i*windowMs`); event-scaled sparse lists and
    singleton timestamps use the descriptive key `time`
    (frag/damage/shot/chat/backpack/weapon-pickup/airgib/timeline entries,
    events rows, row-bucket `time`, state-at `time`, item
    `firstTake.time`). The name never encodes the unit —
    `timeUnit`, where present, is a constant `"ms"` self-description echo.

    Two documented exceptions, neither a match-relative time: `/demoinfo`
    is the KTX-native units island (integer seconds on KTX's own clock,
    `timelimit` in minutes, item hold in seconds) and carries no `timeUnit`
    echo; search `from` / `to` are calendar dates (`YYYY-MM-DD`), not
    times.

    ### Caching
    Per-demo 2xx responses carry `Cache-Control: public, max-age=86400,
    immutable` and an `ETag` of the form `"<sha>-v<schemaVersion>"`
    (per-artifact: `"<sha>-<name>@v<n>"`; binary-statics: `"<kind>-v<n>"`).
    A demo's analysis never changes for a given schema version — cache
    aggressively and revalidate with `If-None-Match` for cheap 304s.

    ### Availability — the 422 rule
    Object-shaped sections that need a demo capability return
    `422 <section>_unavailable` when the demo structurally lacks the signal
    (non-KTX server, no position track, …). Treat these as "panel
    unavailable for this demo", not failures. Always-computable list
    sections (`/items`, `/backpacks`, `/weapon-pickups`, `/chat`) return
    200 with an empty body instead.

    ### Parameter conventions
    Query parameter **names** are case-insensitive (canonical spelling is
    camelCase). CSV parameters are comma-separated lists. Player-name
    values are case-sensitive (QW names are case-significant); weapon /
    item / kind / loc / layout tokens are case-insensitive.

    Unknown query parameter names are rejected: a request carrying a query
    key the endpoint does not accept 400s with code `unknown_param` (the
    message names the offender and the accepted keys), rather than silently
    ignoring it. The `label` traffic-source tag is accepted on every
    endpoint. Enum-valued params (e.g. `/events` and `/chat` `types`)
    likewise 400 (`invalid_param`) on an unknown value instead of matching
    nothing.

    ### API stability
    **`/v1` is not frozen yet.** Most change is additive — new endpoints and
    new response fields appear at any time without announcement — but a
    schema upgrade **can still remove a documented field or change what one
    means, inside `/v1`**. Schema v70 is the worked example: `/overview` lost
    `topKills`, `topStreaks`, `topPowerups` and `hasRegionControl` once they
    were measured at 78-88% of the response and found to be copies of
    `/top-kills`, `/lives` and `/events`. Treat this surface as one you can
    build against and will occasionally have to re-check, not one you can
    pin and forget.

    What holds today is that **nothing changes silently**: every observable
    change bumps `schemaVersion`, every change is written up in
    RELEASE_NOTES.md against the version that carries it, this spec is
    generated from the running code and validated against real responses in
    CI, and the MCP shim deploys in lockstep with the API. So watch
    `schemaVersion` — it is your cache key, and until the freeze it is also
    the signal to go read what moved.

    **Where this is going, in the near future:** an additive-only `/v1`
    where documented fields don't change meaning, change type, or disappear;
    a genuine break shipping as `/v2/<endpoint>` served alongside `/v1`
    rather than replacing it; and old routes retiring on a minimum of 8
    weeks' notice, in practice only once measured usage has drained. That
    is the destination and the rules it will be run by — it is not a promise
    that is already in force. A **correctness fix is not a break**: when a value
    changes because it was computed wrongly, the field keeps its name and
    type and its documented meaning is not replaced — at most narrowed to
    the semantics it was always meant to have, with the docs updated to say
    so (schema v64: loc/region "time spent" is now documented as "alive,
    observed time spent"). Such fixes ship inside `/v1` and only raise
    `schemaVersion`. The **MCP tool surface** is covered by the same rules:
    the shim and this API deploy in lockstep, so tool names, parameters and
    result semantics change only under the process above.

    `schemaVersion` (the ETag `-v<n>` suffix, `X-Schema-Version`, and this
    document's `info.version`) is a **regeneration counter** that ticks on
    every observable change, most of them purely additive. Treat it as a
    cache key — and, while `/v1` is still moving, as the prompt to check
    RELEASE_NOTES.md before assuming a bump was additive. Once the surface
    is declared stable it goes back to being a pure cache key, because
    breaks will live at `/v2` instead.

    Covered by the contract: documented request parameters, documented
    response fields and their types, documented enum members and status
    codes. **Not** covered, and free to change without a version bump:
    ordering where no order is documented, rounding of derived floats,
    whether an empty value is omitted or emitted, rate-limit thresholds,
    and which demos return `422 <section>_unavailable` (a demo's
    capabilities are a property of the recording). Adding a member to a
    *default* set is additive even though it changes the rows you receive —
    schema v58 added the `demomark` event type to `/events` and to its
    default set, so callers omitting `types` began seeing new rows. Filter
    explicitly if you need a fixed set.

    In return, clients **must ignore unknown fields and unknown enum
    values**, and treat this document as the contract — undocumented
    behaviour you happen to observe may change without notice.

    This document is the complete per-endpoint reference. Deep
    field-level semantics of the underlying analysis (the Result
    contract shared with the Go library and WASM builds) are served by
    this API at [/docs/result-schema](/docs/result-schema)
    (raw markdown: /docs/result-schema.md).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: Same origin — correct for localhost and the hosted deployment alike.
security:
  - bearerKey: []
tags:
  - name: meta
    description: Liveness, build stamp, auth check, this spec.
  - name: demo
    description: Demo identity, warm-up, and curated summaries.
  - name: combat
    description: Frags, damage, shots, aim.
  - name: items
    description: Item spawners, backpacks, weapon pickups.
  - name: timeline
    description: Unified events, chat, region control, key moments.
  - name: positional
    description: Position-derived views — buckets, slices, state-at, trails, LOS.
  - name: streams
    description: Raw projectile / beam / nail flight streams.
  - name: artifacts
    description: The analyzer DAG surface — manifest, graph, generic artifact accessor.
  - name: maps
    description: Per-map static data (no demo needed).
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [meta]
      summary: Liveness probe
      security: []
      parameters:
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: Server is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /openapi.yaml:
    get:
      operationId: getOpenAPISpec
      tags: [meta]
      summary: This document
      description: >
        The OpenAPI 3.1 description of this server, embedded in the binary.
        ETag is a content hash; revalidate with If-None-Match.
      security: []
      parameters:
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The spec.
          content:
            application/yaml:
              schema: { type: string }
        "304": { $ref: "#/components/responses/NotModified" }
  /docs:
    get:
      operationId: getDocsPage
      tags: [meta]
      summary: Browsable API reference
      description: >
        Interactive reference for this spec (vendored RapiDoc; no external
        requests). Point a browser here.
      security: []
      parameters:
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The viewer page.
          content:
            text/html:
              schema: { type: string }
        "304": { $ref: "#/components/responses/NotModified" }
  /docs/result-schema:
    get:
      operationId: getResultSchemaPage
      tags: [meta]
      summary: Result schema reference
      description: >
        RESULT_SCHEMA.md — the field-level reference for the analysis
        output (vocabulary codes, stream forms, per-section field
        tables, schema version history) — rendered as a standalone page
        (vendored renderer, no external requests). Raw markdown at
        /docs/result-schema.md.
      security: []
      parameters:
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The rendered reference.
          content:
            text/html:
              schema: { type: string }
        "304": { $ref: "#/components/responses/NotModified" }
  /v1/version:
    get:
      operationId: getVersion
      tags: [meta]
      summary: Build stamp
      security: []
      parameters:
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: Build identity of the running binary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
  /v1/auth/check:
    get:
      operationId: checkAuthKey
      tags: [meta]
      summary: Validate the presented API key
      description: >
        204 when the Bearer key is valid. Deliberately NOT auth-exempt —
        this route is the check itself. In no-auth (localhost) mode it
        always succeeds.
      parameters:
        - $ref: "#/components/parameters/Label"
      responses:
        "204":
          description: Key accepted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/artifacts:
    get:
      operationId: listArtifacts
      tags: [artifacts]
      summary: Analyzer DAG artifact manifest
      description: >
        Every DAG node (name, requires, provides, mutates, lazy, cost,
        resultKey, servable, description). Static per binary; ETag
        `"artifacts-v<schemaVersion>"`.
      parameters:
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The manifest.
          headers: &staticHeaders
            ETag: { $ref: "#/components/headers/ETag" }
            X-Schema-Version: { $ref: "#/components/headers/XSchemaVersion" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactsManifest" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/graph:
    get:
      operationId: getGraph
      tags: [artifacts]
      summary: Analyzer DAG as JSON
      description: >
        Nodes (cost / resultKey / lazy) + artifact edges, exactly
        `analyzer.ExportGraph("json")`. Static per binary; ETag
        `"graph-v<schemaVersion>"`.
      parameters:
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The graph.
          headers: *staticHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Graph" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/demos:
    post:
      operationId: uploadDemo
      tags: [demo]
      summary: Upload a demo file for analysis
      description: |
        Analyze a demo you hold locally — the API counterpart of the web
        app's local-file flow — instead of one addressable by hub gameId.

        POST the demo as the raw request body (`application/octet-stream`,
        e.g. `curl --data-binary @demo.mvd.gz`); a raw `.mvd` or a gzipped
        `.mvd.gz` is accepted, sniffed by the gzip magic bytes (Content-Type
        is not enforced). The server stores it, parses it synchronously, and
        returns the same identity metadata as `POST /v1/demos/{id}` — a
        `sha:HEX` `demoId` you then read with the per-demo GET endpoints. Like
        a cold gameId load this call can be slow (it parses before
        responding); a client that times out can retry into a cache hit.

        **Identity.** The `sha` keys the demo by the SHA-256 of its
        UNCOMPRESSED content, so uploading the raw `.mvd` and its `.mvd.gz`
        yields the same id, and re-uploading an already-known demo is
        idempotent (`fromCache: true`, deduped — no reparse).

        **Privacy.** An uploaded demo has no owner — it is readable by ANY key
        holder who knows its `sha`. It is a first-class entry in the shared
        cache eviction pool, so after eviction a `sha:` GET returns 404 and
        the client simply re-uploads.

        **Limits.** The on-wire body is capped at 64 MiB and the decompressed
        content at 512 MiB; in auth mode a per-key daily quota (bytes + demo
        count) also applies. A body that is not a parseable MVD demo — or one
        that parses to no actual game — is rejected and not retained. When the
        server runs with uploads disabled (`-max-upload-bytes 0`) this
        endpoint returns 404 `uploads_disabled`.
      requestBody:
        required: true
        description: The demo file bytes — raw `.mvd` or gzipped `.mvd.gz`.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      parameters:
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: Demo identity + cache state.
          headers:
            X-Cache: { $ref: "#/components/headers/XCache" }
            X-Schema-Version: { $ref: "#/components/headers/XSchemaVersion" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoadResult" }
        "400":
          description: >
            Empty body (`invalid_param`) or a gzip-magic body that is not a
            valid gzip stream (`invalid_gzip`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Uploads are disabled on this server (`uploads_disabled`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "413":
          description: >
            Body exceeds the on-wire limit, or decompresses past the
            512 MiB cap (`demo_too_large`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: >
            The uploaded bytes are not a parseable MVD demo, or parse to no
            analyzable game (`unparseable_demo`). Not retained.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          description: >
            Per-key daily upload quota exceeded (`upload_quota_exceeded`) or
            the request rate limit (`rate_limited`); both carry `Retry-After`.
          headers:
            Retry-After:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/demos/{id}:
    post:
      operationId: loadDemo
      tags: [demo]
      summary: Warm the cache for a demo (idempotent)
      description: >
        Resolves + parses the demo into the cache and returns identity
        metadata. Optional: every per-demo GET auto-loads on cache miss —
        use this only to warm up or to learn the SHA behind a gameId.
        Non-cacheable action: no Cache-Control/ETag on the response.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: Demo identity + cache state.
          headers:
            X-Cache: { $ref: "#/components/headers/XCache" }
            X-Schema-Version: { $ref: "#/components/headers/XSchemaVersion" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoadResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/overview:
    get:
      operationId: getOverview
      tags: [demo]
      summary: Curated match summary
      description: |
        Map, teams, corrected scoreboard, top streaks, top powerup runs,
        timing, data-quality `errors[]`.

        **Units seam.** Overview times are int32 MILLISECONDS (verbatim from
        the stored schema).

        **Ordering.** `teams` and `players` are frag-sorted descending — index
        0 is the winner.

        **Wall-clock mapping.** `timing` converts a match-relative game time g
        (ms) to real time — the game clock freezes during pauses, so
        wallClockMs = demoStartUnixMs + demoOffset + g + the durations of
        pauses at or before g (±demoStartAccuracyMs). `timing` is omitted when
        the demo carries no wall-clock source; `pauses` when the match had
        none.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The overview.
          headers: &perDemoHeaders
            ETag: { $ref: "#/components/headers/ETag" }
            X-Cache: { $ref: "#/components/headers/XCache" }
            X-Schema-Version: { $ref: "#/components/headers/XSchemaVersion" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/demoinfo:
    get:
      operationId: getDemoInfo
      tags: [demo]
      summary: KTX demoinfo block (verbatim pass-through)
      description: >
        Per-player weapon accuracy, kills/deaths, damage, sprees, item
        pickup counts, RL/LG transfers — exactly as KTX reported them.
        KTX UNITS ISLAND: integer seconds on KTX's own clock; `timelimit`
        is minutes; item `{took, time}` is count + cumulative-hold seconds.
        Unavailable (422 `demoinfo_unavailable`) on non-KTX servers or
        pre-match aborts.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The KTX demoinfo section.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoInfo" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/metadata:
    get:
      operationId: getMetadata
      tags: [demo]
      summary: Server cvars + KTX match settings
      description: >
        Full serverinfo cvars plus parsed match settings (timelimit,
        fraglimit, antilag, midair, …). 422 `metadata_unavailable` when the
        demo has no fullserverinfo / countdown centerprint.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The metadata section.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metadata" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/player-stats:
    get:
      operationId: getPlayerStats
      tags: [demo]
      summary: Canonical per-player + per-team statistics
      description: |
        The one-call scoreboard: corrected
        frags/kills/deaths/suicides/teamKills with efficiency, damage,
        per-weapon accuracy, per-kind pickup tallies, and POSSESSION TIME —
        how long each player held each weapon, each armor type, and NO armor.

        **Availability & provenance.** Available on EVERY demo, including ones
        with no KTX demoinfo block (a missing KTX block is never a reason to
        422 — see the 422 response below for the one case that is). Each stat
        family carries `src` ("derived" | "ktx" | "derived:unbounded" on
        damage; "mixed" on a team row is the phantom-roster canary) naming its
        source, with a `sources` roll-up; `/demoinfo` stays the verbatim KTX
        pass-through to diff against.

        **Units.** `window.*Ms` and every `hold.*.ms` / `longestMs` are int32
        MILLISECONDS; `efficiency`, `shareAlive` and `shareMatch` are RATIOS
        in [0,1], not percentages. Prefer the emitted shares over dividing
        yourself — on a team row the denominators are team time.

        **Note** our armor hold time reads LOWER than a KTX end-of-match table
        by design: KTX's armor clock keeps running after the armor is chewed
        to zero (ktx/src/items.c:505-522).
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/Players"
        - $ref: "#/components/parameters/PlayerStatsTeams"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The player-stats section.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerStats" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/frags:
    get:
      operationId: getFrags
      tags: [combat]
      summary: Frag aggregates + kill log
      description: |
        Top-level frag aggregates plus the full kill log.

        **Filters.** When any scoping filter (players / weapon / from / to) is
        active, ALL aggregates are recomputed from the filtered log so they
        stay consistent with the entries shown.

        **Measuredness.** `killsMeasured` (always present) is the demo-global
        verdict on whether kill ATTRIBUTION was observable at all. When it is
        `false` the log is empty on a demo where players demonstrably died —
        every obituary went unmatched — so `kills`, `teamkills` and `byWeapon`
        are zeros that are NOT measurements, while `deaths` still is. It is
        not recomputed per filter: a filter that matches nothing does not make
        a demo unmeasurable. `/top-windows` and `/lives` publish the same
        verdict as `measured.frags`.

        **Errors.** 422 `frags_unavailable` when the demo has no frag log.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/Players"
        - $ref: "#/components/parameters/Weapons"
        - $ref: "#/components/parameters/WeaponsLegacy"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Summary"
        - $ref: "#/components/parameters/Label"
