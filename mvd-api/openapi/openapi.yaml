    TopWindows:
      type: object
      additionalProperties: false
      required: [scoredBy, mode, limit, perPlayer, measured, windows]
      # EXACTLY ONE knob accompanies mode, machine-enforced: a fixed envelope
      # carries windowMs and never gapMs, a gap envelope the mirror image. The
      # branches discriminate on the mode const, so exactly one can match.
      # TestTopWindowsEnvelopeExactlyOneKnob pins the invalid combinations.
      oneOf:
        - properties:
            mode:
              const: fixed
              description: Branch discriminator — the fixed envelope.
          required: [windowMs]
          not: { required: [gapMs] }
        - properties:
            mode:
              const: gap
              description: Branch discriminator — the gap envelope.
          required: [gapMs]
          not: { required: [windowMs] }
      properties:
        timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        scoredBy: { $ref: "#/components/schemas/ScoringRule" }
        measured: { $ref: "#/components/schemas/MeasuredSources" }
        dmg: { $ref: "#/components/schemas/IntervalDmgFamily" }
        boundedMode: { $ref: "#/components/schemas/IntervalBoundedMode" }
        mode:
          type: string
          enum: [fixed, gap]
          description: >
            The segmentation these windows were cut by, echoed on EVERY
            response — fixed ones included — so a consumer never has to infer
            it from which knob field happens to be present. Exactly one of
            `windowMs` (fixed) and `gapMs` (gap) accompanies it.
        windowMs:
          type: integer
          format: int32
          description: >
            Window length in ms (echoed). FIXED RESPONSES ONLY: it is absent
            under `mode=gap`, where windows are as long as their events and a
            fixed length would be a lie.
        gapMs:
          type: integer
          format: int32
          description: >
            The inter-event gap these clusters were cut at, echoed. GAP
            RESPONSES ONLY (it has no meaning, and no default, under
            `mode=fixed`).
        limit:
          type: integer
          description: >
            The total cap as it was applied, echoed after defaulting. An
            out-of-range request is REJECTED with a 400, not clamped, so this
            only ever differs from what you sent when you sent nothing (you get
            the default 10). A NEGATIVE value is echoed verbatim and is not a
            cap — it is the "uncapped" spelling.
        perPlayer:
          type: integer
          description: >
            The per-player cap as it was applied, echoed. `0` (the default,
            from omitting the parameter) and any negative value both mean
            uncapped; neither is a cap.
        windows:
          type: array
          description: Ranked windows, best first. Never null.
          items: { $ref: "#/components/schemas/TopWindow" }
    TopWindow:
      type: object
      required: [rank, player, start, end, score]
      properties:
        rank: { type: integer, description: "1-based position in this response." }
        player: { type: string, description: "The player who scored in this window." }
        team: { type: string, description: "Their team at match end; absent in a demo with no team labels." }
        start: { type: integer, format: int32, description: "Match-relative ms." }
        end:
          type: integer
          format: int32
          description: >
            Under `mode=fixed`, `start + windowMs` (the identity holds over
            REST because `windowMs` is capped at the match duration; the view
            clamps `end` at the int32 ceiling for in-process callers, who face
            no such cap). Under `mode=gap` it is the run's LAST scoring event,
            so the row is as long as the stretch was and `end == start` on a
            single-event run.
        score:
          type: integer
          description: >
            The metric total over the window — the value that selected and
            ranked it. WITHOUT a `weapons` filter it equals the same-named stat
            below exactly (telefrags and stomps score just as they fold); with
            one it is a SUBSET of that stat. The envelope's `scoredBy` says
            exactly what produced it.
      allOf:
        - $ref: "#/components/schemas/IntervalStats"
    TopKills:
      type: object
      additionalProperties: false
      required: [gapMs, contestedMs, limit, measured, kills]
      properties:
        timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        measured: { $ref: "#/components/schemas/MeasuredSources" }
        dmg: { $ref: "#/components/schemas/IntervalDmgFamily" }
        boundedMode: { $ref: "#/components/schemas/IntervalBoundedMode" }
        gapMs:
          type: integer
          format: int32
          description: >
            The capture gap as it was applied, echoed after defaulting — it is
            what every `damage` / `hits` / `spanMs` / `maxGapMs` below means.
        contestedMs:
          type: integer
          format: int32
          description: The returnDamage window as it was applied, echoed after defaulting.
        limit:
          type: integer
          description: >
            The cap as it was applied, echoed after defaulting. An
            out-of-range request is REJECTED with a 400, not clamped, so this
            only ever differs from what you sent when you sent nothing (you
            get the default 20). A NEGATIVE value is echoed verbatim and is
            not a cap — it is the "uncapped" spelling.
        kills:
          type: array
          description: Ranked bursts, hardest first. Never null.
          items: { $ref: "#/components/schemas/TopKill" }
    TopKill:
      type: object
      additionalProperties: false
      required: [rank, killer, victim, time, weapon, damage, hits, spanMs, maxGapMs, returnDamage]
      description: >
        One kill burst. Also the row shape of `/overview`'s `topKills`, which
        carries this same list at the documented defaults.
      properties:
        rank: { type: integer, description: "1-based position in this response." }
        killer: { type: string, description: "Who made the kill; the frag log's name." }
        victim: { type: string, description: "Who died." }
        team: { type: string, description: "The KILLER's team at match end; absent in a demo with no team labels." }
        time:
          type: integer
          format: int32
          description: "The kill instant, match-relative ms — also the run's last hit."
        weapon:
          type: string
          description: "The killing weapon, which IS the burst's weapon (see the endpoint description)."
        damage:
          type: integer
          description: >
            The run's summed damage in the envelope's `dmg` family — the value
            that ranked this row.
        hits: { type: integer, description: "How many damage events the run holds." }
        spanMs:
          type: integer
          format: int32
          description: >
            `time` minus the run's first hit — the DISPLAY figure ("291 dmg in
            1.7 s"). Not a valid rule for narrowing to a tighter gap; use
            `maxGapMs`.
        maxGapMs:
          type: integer
          format: int32
          description: >
            The largest gap between consecutive hits in the run, `0` when
            `hits` is 1. This is the EXACT client-side narrowing filter:
            a kept row (`maxGapMs <= g`) carries its gap-`g` value verbatim;
            an over-merged row is dropped by the filter rather than
            truncated (request `gapMs=g` for the exact tighter walk).
        victimWep:
          type: string
          description: >
            The victim's weapon class (`sg`|`mid`|`lg`|`rl`|`both`) at the
            killing hit, straight from that damage event — the same field
            `/damage` reports. Absent when the wire carried none.
        returnDamage:
          type: integer
          description: >
            What the victim dealt back to this killer over the `contestedMs`
            window before the kill: any weapon, same damage family. A value,
            not a flag — you own the threshold that calls a kill contested.
    ScoringRule:
      type: object
      additionalProperties: false
      required: [metric]
      description: >
        The scoring rule that produced every row's `score`. It sits on the
        ENVELOPE, not on each window: one query means one rule, so a per-row
        copy would repeat the same object up to `limit` times. It is also the
        only place the metric is echoed.
      properties:
        metric: { type: string, description: "The canonicalised metric that produced `score`." }
        weapons:
          type: array
          items: { type: string }
          description: Weapon tokens the scoring events were restricted to, if any (lowercased, sorted).
        dmg:
          type: string
          description: Damage family used, for the damage metrics.
    IntervalDmgFamily:
      type: string
      enum: [raw, bounded]
      description: |
        The damage family every `damageGiven` / `damageTaken` /
        `damageGivenTeam` / `damageGivenSelf` / `damageByWeapon` in this
        response was computed in, echoed exactly as `/damage` echoes its own
        `dmg`.

        It applies under EVERY metric, not only the damage ones — the stats
        block reports damage whichever metric selected the interval — so on
        `/top-windows` with `metric=frags` this is the only place the family
        is named (`scoredBy.dmg` carries the same value when the metric is a
        damage one, from the same single resolution).

        **Defaults.** The REST default is `bounded`, matching `/damage`; the
        in-process view default is `raw`. A DEFAULTED bounded on a demo with
        no bounded family falls back to `raw` and says so here, while an
        EXPLICIT `dmg=bounded` on such a demo is a 422 `bounded_unavailable`.

        Absent only on a demo with no damage stream at all, where
        `measured.damage` is `false` anyway.
    IntervalBoundedMode:
      type: string
      description: |
        Whether this demo's bounded damage family was reconstructed —
        `standard`, or a `skipped:*` reason when the server mode rewrites the
        take in ways the wire does not expose. Same field, same values, as
        `/damage`'s `boundedMode` (see the `Damage` schema for the enumerated
        reasons); it is the field that NAMES the state, so read it rather than
        inferring from `dmg`.

        Absent only on a demo with no damage stream at all.
    MeasuredSources:
      type: object
      additionalProperties: false
      required: [frags, damage, shots, locs, items, liveness]
      description: |
        Which underlying streams THIS DEMO carries. **Measuredness is read from
        here and never from a field's absence** — every numeric field of the
        stats block is emitted even at zero, so `damageGiven: 0` alone cannot
        tell a player who dealt none from a demo with no damage stream at all.

        `false` means the source is absent for the whole demo. `true` does not
        promise a non-zero row: within a measured source a zero is a
        measurement, and an absent MAP KEY (`byWeapon`, `victims`,
        `damageByWeapon`) means "none of that kind".
      properties:
        frags:
          type: boolean
          description: |
            Whether KILL ATTRIBUTION was observable — the stored demo-global
            verdict `/frags` publishes as `killsMeasured`, NOT merely "a frag
            log exists". It is `false` on a demo whose log is empty while the
            scoreboard shows deaths (every obituary went unmatched), which is
            precisely the case where the zeros below look like measurements.
            One verdict, decided once by the analyzer, so this flag and
            `/frags`' `killsMeasured` cannot drift.

            Gates `kills`, `deaths`, `teamKills`, `suicides`, `byWeapon`,
            `mainWeapon`, `victims`, `eventLocs`, and on `/lives` `killedBy` /
            `deathWeapon`.
        damage:
          type: boolean
          description: >
            Gates `damageGiven`, `damageTaken`, `damageGivenTeam`,
            `damageGivenSelf`, `damageByWeapon`.
        shots: { type: boolean, description: "Gates `shots` and `hits`." }
        locs:
          type: boolean
          description: |
            Gates `locs`, `eventLocs` and `/lives`' `spawnLoc` / `deathLoc`.
            True only when the demo has both a loc table and player loc streams.

            DEMO-WIDE, and computed as "at least one player has a loc stream".
            On a POV recording, where only players inside the recorder's PVS
            are written to the wire, an UNOBSERVED player's row can therefore
            carry empty `locs` under `measured.locs: true`. Read that as
            "unobserved", not as "spent no time anywhere" — a live player
            always occupied somewhere. Not reachable on server-side recordings,
            which write every player.
        items:
          type: boolean
          description: >
            Gates `/lives`' `itemsTaken` (where it is the same signal as
            `itemsTaken: null`). Always present on `/top-windows` too, which
            emits no item field, so one block covers both responses.
        liveness:
          type: boolean
          description: |
            Whether the spawn-to-death segmentation itself was measurable — at
            least one player carries liveness intervals. It distinguishes
            "liveness was not measurable on this demo" from "measured, and this
            player was never alive", which an empty `lives` array conflated.

            `/lives` 422s `lives_unavailable` when it is `false`, so a caller
            only ever observes `false` here on `/top-windows`, which does not
            need it. The flag is present on both responses because the block
            keeps ONE shape across them.
    Lives:
      type: object
      additionalProperties: false
      required: [measured, lives]
      properties:
        timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        measured: { $ref: "#/components/schemas/MeasuredSources" }
        dmg: { $ref: "#/components/schemas/IntervalDmgFamily" }
        boundedMode: { $ref: "#/components/schemas/IntervalBoundedMode" }
        lives:
          type: array
          description: Every life, time-ordered per player, players in name order. Never null.
          items: { $ref: "#/components/schemas/Life" }
    Life:
      type: object
      required: [player, index, start, end, attrStart, attrEnd, endReason, itemsTaken]
      properties:
        player: { type: string, description: "The player whose life this is." }
        team: { type: string, description: "Their team at match end; absent in a demo with no team labels." }
        index: { type: integer, description: "0-based, per player, in time order." }
        start: { type: integer, format: int32, description: "Spawn, match-relative ms." }
        end: { type: integer, format: int32, description: "Death, or match end." }
        attrStart:
          type: integer
          format: int32
          description: >
            Start of the ATTRIBUTION WINDOW — the span every event field in the
            stats block was counted over. Always present: `0` is the legitimate
            value on every player's first life, so an omit-on-zero rule would
            delete the commonest one.
          maximum: 2.147483647e+09
          minimum: -2.147483648e+09
        attrEnd:
          type: integer
          format: int32
          description: |
            End of the attribution window. The window is the life PLUS the
            dead gap that follows it (and, for the first and last lives, out
            to the match edges), so that a posthumous rocket counts for the
            life that fired it.

            **It is wider than `durationMs`**, which measures `end − start` —
            ALIVE time — and this is the one asymmetry in the row: a
            per-second rate computed from a count over `durationMs` reads
            HIGH — slightly when summed across a whole match, by tens of
            percent on a single row where a short life is followed by a long
            dead gap — while `attrEnd − attrStart` is the span the counts
            actually cover.

            **Truncated recordings.** On a POV or otherwise truncated
            recording the final life's window can contain events its player
            earned while provably still present: liveness is clipped using the
            player's OWN samples, spawns and deaths, and a killer-side
            obituary is deliberately not counted as presence evidence.

            **Tiling.** One player's windows tile the match end to end
            (half-open at exactly one side apiece), so no instant belongs to
            two of them and none to none. On a demo with no match window the
            last life's `attrEnd` is the int32 ceiling: there is no match end
            to bound it, and everything after the last life belongs to it.
          maximum: 2.147483647e+09
          minimum: -2.147483648e+09
        endReason:
          type: string
          enum: [death, matchEnd, leftGame]
          description: >
            How the life ended. `death` — a recorded death. `matchEnd` — the
            player was still alive. `leftGame` — the player's position track
            ended (they quit, or the recording lost them); liveness is clipped
            to observed presence, so on a truncated recording this means "the
            recording stopped seeing them", not "they stopped playing".
            Always present: an absent `killedBy` used to conflate all three.
        spawnLoc: { type: string, description: "Loc the life began in; absent without loc data." }
        deathLoc: { type: string, description: "Loc the life ended in." }
        killedBy:
          type: string
          description: >
            Who ended it. Absent when `endReason` is not `death`, and also on a
            death seen only by the health/DF_DEAD detectors with no obituary
            naming it — read `endReason`, not this field, to tell those apart.
            That second state is REACHABLE (the two detectors exist precisely
            because each sees deaths the other misses) but is not currently
            observed: across the 42 cached corpus demos, 0 of the 11364
            death-ended lives — of 11558 lives in total — lack an obituary.
        deathWeapon: { type: string, description: "Weapon or cause that ended the life." }
        itemsTaken:
          type: [array, "null"]
          description: >
            Every item picked up in the life's attribution window, in time
            order. **`null` means the demo carries no item timeline** (the same
            signal as `measured.items: false`); `[]` means it has one and this
            life took nothing. With `summary=true` it is `null` on every row
            regardless of the demo — there, only `measured.items` speaks.
          items: { $ref: "#/components/schemas/LifeItem" }
        weaponsHeld:
          type: array
          items: { type: string }
          description: >
            Which of rl/lg/gl/ssg/sng the player held at any point while ALIVE
            in this life, in that order. Clipped to the alive interval, not to
            the attribution window: KTX does not clear the weapon bits on death,
            so a corpse still reads as armed. Absent means "held none of them",
            not "unknown".
      allOf:
        - $ref: "#/components/schemas/IntervalStats"
    LifeItem:
      type: object
      additionalProperties: false
      required: [item, kind, time]
      properties:
        item: { type: string, description: "Instance name, e.g. `ra_1` — the `name` used by /items." }
        kind: { type: string, description: "Item kind: `ra`, `mh`, `quad`, `rl`, ..." }
        time: { type: integer, format: int32, description: "Pickup, match-relative ms." }
    IntervalStats:
      type: object
      description: |
        The per-interval stats block, shared by `/top-windows` and `/lives` so
        one shape covers every segmentation. All times int32 ms.

        Every NUMERIC field below is always present, including a measured zero.
        Read the envelope's `measured` block to tell "this demo has no shot
        stream" from "this player fired nothing" — never a field's absence. The
        maps and lists are omitted when empty, where absence means "nothing to
        list".
      required:
        - durationMs
        - kills
        - deaths
        - teamKills
        - suicides
        - damageGiven
        - damageTaken
        - damageGivenTeam
        - damageGivenSelf
        - shots
        - hits
      properties:
        durationMs:
          type: integer
          format: int32
          description: |
            end − start.

            For a life this is ALIVE TIME ONLY, while every event field below
            covers the wider attribution window (the life plus the dead gap
            that follows it, so a posthumous rocket counts for the life that
            fired it) — the row's `attrStart` / `attrEnd` carry that window,
            so divide by `attrEnd − attrStart` for an exact rate. A rate
            derived from a count and this duration therefore reads HIGH:
            slightly when summed across a whole match, by tens of percent on a
            single row where a short life is followed by a long dead gap.

            For a top window the two coincide and there is no separate window
            to publish.
        kills: { type: integer, description: "Enemy kills. Suicides and teamkills excluded." }
        deaths:
          type: integer
          description: |
            Death rows from the FRAG LOG naming this player as victim inside
            the attribution window. Sums, over an unfiltered `/lives`
            response, to that player's rows in `/frags`' `frags[]` — not
            necessarily to `/frags`' `byPlayer` scoreboard, which counts
            deaths the log never recorded.

            **Not capped at 1 on `/lives`, and NOT a flag for `endReason`:**

            - it can be 0 on a life whose `endReason` is `death` (the death
              was seen only by the `DF_DEAD` / `STAT_HEALTH` detectors and no
              obituary named it — four such rows on
              `wipeout_3on2_red_vs_blue[q3dm6qw]`);
            - it can EXCEED 1, because a life carries both the death that
              ended it and any death recorded during the dead gap that
              followed (the KTX `dtTELE2` deflection — measured across 11558
              corpus lives: 12 rows with 2 deaths, one with 3).
        teamKills: { type: integer, description: "Teammates killed. Never scores, but shown for context." }
        suicides: { type: integer, description: "Self-inflicted deaths, a subset of `deaths`." }
        byWeapon:
          type: object
          additionalProperties: { type: integer }
          description: Kills by weapon.
        damageGiven:
          type: integer
          description: >
            To enemies. INCLUDES telefrag / stomp value, exactly as `/damage`
            does, so per-interval damage reconciles against that endpoint.
        damageTaken:
          type: integer
          description: >
            From ALL sources — enemy, team, self, world — and including telefrag
            / stomp value.
        damageGivenTeam: { type: integer, description: "Damage dealt to teammates." }
        damageGivenSelf: { type: integer, description: "Self damage, e.g. own rocket splash." }
        damageByWeapon:
          type: object
          additionalProperties: { type: integer }
          description: >
            Enemy damage given, by weapon. EXCLUDES telefrags and stomps (they
            carry no weapon), exactly as `/damage`'s `byWeapon` does, so this
            sums to at most `damageGiven` rather than to it.
        shots: { type: integer, description: "Weapon fires in the interval." }
        hits: { type: integer, description: "Fires that connected." }
        mainWeapon:
          type: string
          description: Weapon with the most kills; ties broken by name so the value is stable.
        victims:
          type: object
          additionalProperties: { type: integer }
          description: Kills per victim. Sums to `kills`.
        locs:
          type: array
          items: { $ref: "#/components/schemas/IntervalLoc" }
          description: >
            Where the TIME went — top loc residences by dwell. Absent when the
            demo carries no loc data; that never fails the request.
        eventLocs:
          type: array
          items: { $ref: "#/components/schemas/IntervalLoc" }
          description: >
            Where the KILLS happened. Routinely disagrees with `locs`, and the
            disagreement is the interesting part.
    IntervalLoc:
      type: object
      additionalProperties: false
      required: [loc]
      properties:
        loc: { type: string, description: "Loc name." }
        ms: { type: integer, format: int32, description: "Dwell, on `locs`." }
