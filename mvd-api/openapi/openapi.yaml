        teams:
          description: "Per-team frag totals."
          items:
            additionalProperties: false
            properties:
              frags:
                description: "Net QW frag score."
                type: integer
              name:
                description: "Name / display label."
                type: string
            required:
              - name
              - frags
            type: object
          type:
            - "null"
            - array
        timing:
          description: "Wall-clock anchor + pause data mapping match game-time to real time."
          additionalProperties: false
          properties:
            demoOffset:
              description: "Demo-start offset from match start, int32 ms."
              maximum: 2.147483647e+09
              minimum: -2.147483648e+09
              type: integer
            demoStartAccuracyMs:
              description: "Uncertainty of the demo-start wall-clock anchor, int32 ms."
              maximum: 2.147483647e+09
