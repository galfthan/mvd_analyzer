        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/WindowMs"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/RegionsMode"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The control timeline.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegionControl" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
