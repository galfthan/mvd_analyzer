                description: "Liquid code at the instant (0 dry, else (type<<2)|level)."
                maximum: 127
                minimum: -128
                type:
                  - "null"
                  - integer
              nl:
                description: "Nails ammo at the instant."
                maximum: 32767
                minimum: -32768
                type:
                  - "null"
                  - integer
              pe:
                description: "Pent active at the instant."
                type:
                  - "null"
                  - boolean
              pos:
                description: "Position [x,y,z] at the instant, map units."
                additionalProperties: false
                properties:
                  x:
                    description: "X coordinate, map units."
                    type: number
                  "y":
                    description: "Y coordinate, map units."
                    type: number
                  z:
                    description: "Z coordinate, map units."
                    type: number
                required:
                  - x
                  - "y"
                  - z
                type:
                  - "null"
                  - object
              posAgeMs:
                description: |
                  Age of the position sample every positional field on this
                  row (`pos`, `view`, `hgt`, `lq`, `vel`) was snapped to:
                  `time` minus that sample's timestamp, int32 ms. Positive
                  means the state is carried forward from an earlier sample;
                  negative means the nearest sample is a LATER one.

                  The carry-forward itself is unbounded by design — this is
                  the evidence age, so a consumer can apply the same 250 ms
                  discipline the occupancy endpoints do (`/region-control`,
                  `/loc-graph` and `/loc-trails` drop a sample once its age
                  reaches 250 ms).

                  Present only when the request asked for at least one
                  positional field AND a sample resolved — a field set with no
                  positional field in it never carries this key, which
                  therefore says nothing about whether the demo has a position
                  track.
                maximum: 2.147483647e+09
                minimum: -2.147483648e+09
                type: integer
