        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/damage:
    get:
      operationId: getDamage
      tags: [combat]
      summary: Damage log + aggregates
      description: |
        Per-hit damage log plus aggregates (matrix, per-weapon, given/taken)
        and the KTX-scoreboard cross-check.

        **Positional kills.** Telefrags and stomps are excluded from every
        per-weapon map (byWeapon/byWeaponTeam/byWeaponSelf) and from
        matrix/totalDamage, and listed separately, but their kill value DOES
        fold into given/taken and, on enemy kills, the EWep victim-weapon
        buckets (no fold at all on skipped:* demos — pure exclusion there). On
        a telefrag/stomp the folded value appears as `bounded` (and `damage`
        when the raw fold differs) on the telefrags[]/stomps[] entries.

        **Two damage families** (schema v54), selected by `dmg`:

        - the RAW family is the unbound wire value (includes overkill), so
          totals run higher than the KTX scoreboard;
        - the BOUNDED family reconstructs KTX-scoreboard semantics (armor
          absorbed + health capped to victim health).

        `boundedMode` reports whether that reconstruction ran (`standard`) or
        was skipped (`skipped:midair` / `skipped:instagib` /
        `skipped:dmgfrags`, where the server mode rewrites the take in ways
        the wire does not expose).

        An unset `dmg` defaults to `bounded` for both the summary and the full
        log; an unfiltered bounded/both SUMMARY sources its per-player bounded
        figures from the exact KTX end-of-match scoreboard when the demo
        carries demoInfo (`boundedSource` echoes `ktx` vs `reconstructed`;
        `taken` and the enemyVs* buckets stay reconstructed).

        **EWep buckets.** Per-player EWep buckets slice enemy-given damage by
        what the victim held:
        enemyVsSg/enemyVsMid/enemyVsLg/enemyVsRl/enemyVsBoth, with
        ewep = lg+rl+both.

        **Filters.** Filters recompute aggregates like /frags. The
        `scoreboard` cross-check is a KTX whole-match figure with no per-event
        provenance, so it CANNOT be recomputed against a `weapons` or a
        RESTRICTIVE time window: it is narrowed by a players-only filter but
        OMITTED entirely once a `weapons` or a restrictive time filter is
        active (an explicit `from`/`to` window covering the whole match counts
        as unfiltered).

        **Errors.** 422 `damage_unavailable` without the KTX
        mvdhidden_dmgdone stream, or `bounded_unavailable` for an EXPLICIT
        `dmg=bounded` on a skipped:* demo (a DEFAULTED bounded there falls
        back to raw).
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/Players"
        - $ref: "#/components/parameters/Weapons"
        - $ref: "#/components/parameters/WeaponsLegacy"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Summary"
        - $ref: "#/components/parameters/Dmg"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: Aggregates + per-hit log (log omitted with `summary`).
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Damage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
