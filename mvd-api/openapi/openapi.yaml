        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/top-windows:
    get:
      operationId: getTopWindows
      tags: [timeline]
      summary: Each player's best stretches of the match
      description: |
        Top-scoring windows under one of two segmentations, chosen with
        `mode`. Each has a one-sentence contract:

        - `mode=fixed` (the default) — "in these `windowMs` milliseconds this
          player scored higher on `metric` than in any other stretch of the
          same length."
        - `mode=gap` — "a window is a maximal run of scoring events in which
          consecutive events are no more than `gapMs` apart; its score is
          their sum."

        `windowMs` is fixed mode's main knob — 5000 gives damage bursts, 30000
        gives hot streaks. `gapMs` is gap mode's, is REQUIRED there and has no
        default; each mode rejects the other's knob with a 400. There is
        deliberately no adaptive mode with a tuning constant in it; for the
        naturally variable-length unit use `/lives`, and for a fixed grid use
        `/buckets`.

        **Everything below applies to BOTH modes** — metric vocabulary,
        ranking and the tie-break, both caps, `weapons=` scoping, `minScore`,
        the stats block, measuredness and the damage family — except where the
        text names `windowMs`. What gap mode changes is only where a window
        starts and ends: rows are the runs themselves (so they are disjoint
        per player by construction, with no overlap suppression), `end` is the
        run's last event rather than `start + windowMs`, a run of one event is
        a legitimate row with `durationMs` 0, and a run may span the player's
        own death — `/lives` is the per-life view. See the `mode` and `gapMs`
        parameters for the per-metric starting points and the rest of the
        contract.

        **`/top-windows mode=gap` vs `/top-kills`.** They are adjacent but not
        substitutes: `/top-kills` is the per-KILL view (each row one kill plus
        the killing-weapon burst that produced it, kill-anchored, clipped at
        the killer's life start, with `returnDamage` and `maxGapMs`), while
        gap windows are the per-STRETCH view (best sustained output, no kill
        required — a 300-damage stretch with zero kills is a row — and rows
        never overlap). At `metric=frags&weapons=rl&gapMs=3000` the two do
        collapse onto each other, and there gap mode is the wrong tool: RL
        inter-kill gaps run p50 ≈ 11.8 s, so 85% of clusters would be
        singletons. Use frag gaps of 8000-15000 for multi-kill stretches, or
        damage gaps around 3000 for rampages.

        **`from`/`to` bound where a window may START, not what it covers** —
        the one place this endpoint departs from the shared parameter
        description. A window anchored at or before `to` still runs the full
        `windowMs` past it, so `to=1000&windowMs=30000` returns the best
        window ANCHORED in the first second, which covers up to 31 s, not
        "the best window inside the first second". This is deliberate:
        scoring is clipped to the same span the row reports, so a row's
        `score` and its stats block always describe one identical interval.
        To constrain what a window COVERS, shrink `windowMs`.

        **Anchoring & shape.** Windows are anchored at REAL event times, not
        a grid, so "the best 30 s" is exact rather than snapped. They are
        non-overlapping per player and returned as ONE FLAT LIST, each row
        carrying `player`, `team` and a 1-based `rank`.

        **Ordering: `score` first, then a fixed complementary metric.** Ties
        on `score` are the common case — on `metric=frags` most of a page
        holds the same small integer — so rows tied on the metric are ranked
        by the other half of the same moment: `damageGiven` under
        `frags`/`netFrags`/`shots`/`hits`, `frags` under
        `damageGiven`/`netDamage`, `damageTaken` under `deaths`, `deaths`
        under `damageTaken`; then earlier start, then player name. There is
        no parameter for it. The secondary is read UNSCOPED and in the
        response's own damage family (the `dmg` echo), so it is exactly the
        same-named field of the row's stats block — `weapons=` narrows the
        score but never the tie-break. It also decides WHICH of a player's
        overlapping equal-scoring candidates survives, so a window may now be
        the stretch that ENDS on the scoring event rather than the one that
        starts on it, when that stretch carries more of the complementary
        metric. Demos with no stream for the secondary (no damage log under
        `metric=frags`) simply tie at 0 and fall through to the positional
        keys.

        **Caps & defaults.** Two independent caps shape it:

        - `perPlayer` (max windows from any one player) is applied BEFORE
          `limit` (the total), so `perPlayer=3&limit=10` means "the top 10,
          at most 3 from anyone" rather than "the top 3 of the first three
          players".
        - The defaults — `limit=10`, `perPlayer=0` — make a bare call the
          match-wide top 10.

        **`weapons=` and scoring.** `weapons` scopes the SCORING events only:
        the stats block still describes everything that happened in the
        window, so with `metric=damageGiven&weapons=lg` the `score` is a
        subset of `damageGiven`. The envelope's `scoredBy` (once, not per
        row — it is the same rule for every window) says which is which.
        Valid weapon tokens depend on the metric's own source (the frag log
        knows `hook` and `water`, the damage log `explobox` and `drown`, the
        shot stream only what can be fired); `water` and `drown` are accepted
        interchangeably.

        - Suicides and teamkills never score, though they do appear in the
          stats block.
        - Telefrags and stomps DO score, under every metric they contribute
          to: their value folds into `damageGiven`/`damageTaken` as `/damage`
          reports it and is scored on the same terms, which is why an
          UNFILTERED row's `score` equals the same-named field of its own
          stats block exactly. `weapons` is the only thing that makes the two
          diverge, and it selects positional kills too — `weapons=tele`
          scores telefrags alone.
        - The one exclusion is `damageByWeapon`, matching `/damage`'s own
          `byWeapon`: a positional kill carries no wire weapon.

        **Measuredness.** Every numeric stat is emitted even at zero; read
        the envelope's `measured` block, never a field's absence, to tell an
        unmeasured source from a measured zero.

        **`dmg` — the damage family.** `dmg` selects the family of the whole
        STATS BLOCK and so applies under EVERY metric, not only the damage
        ones — a window picked by `metric=frags` still reports `damageGiven`.
        The resolved family and the demo's reconstruction state come back on
        the envelope as `dmg` and `boundedMode`, exactly as `/damage` echoes
        them; read `dmg` rather than assuming the `bounded` default took,
        since it silently becomes `raw` on a demo whose reconstruction was
        skipped.

        **Errors.** 422 `top_windows_unavailable` when the demo carries no
        source stream for the chosen metric, and 422 `bounded_unavailable` —
        under any metric — for an EXPLICIT `dmg=bounded` on a demo whose
        bounded reconstruction was skipped. Missing loc data omits
        `locs`/`eventLocs` only and never fails the request.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/Metric"
        - $ref: "#/components/parameters/TopWindowMode"
        - $ref: "#/components/parameters/TopWindowMs"
        - $ref: "#/components/parameters/TopWindowGapMs"
        - $ref: "#/components/parameters/TopWindowLimit"
        - $ref: "#/components/parameters/PerPlayer"
        - $ref: "#/components/parameters/Players"
        - $ref: "#/components/parameters/Weapons"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/DmgFamily"
        - $ref: "#/components/parameters/MinScore"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The ranked windows.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopWindows" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/top-kills:
    get:
      operationId: getTopKills
      tags: [timeline]
      summary: The match's hardest kill bursts
      description: |
        The highlight-reel view: every enemy kill ranked by how hard the burst
        that produced it hit. Neighbours — `/frags` is the exhaustive kill LOG
        with no damage figure, `/damage` the whole-match aggregates plus the
        per-hit log, `/top-windows` the best fixed-length stretches; this one
        ranks individual KILLS.

        **What a burst is.** For each enemy kill, the contiguous run of
        **killing-weapon** hits the killer landed on that victim leading up to
        it, summed in the requested damage family. The run is clipped below by
        the start of the victim's current life.

        **The burst is the KILLING WEAPON's run, and that is the question this
        endpoint answers** — "how hard was this burst with this weapon".
        Measured over 1,866 enemy kills, on ~8% of them that UNDERSTATES what
        produced the kill: a rocket softens, a shotgun finishes, and the row
        reads `weapon: sg, damage: 16` for a kill that took 250 across
        weapons. Deliberate, not a defect. "What did the kill take across
        weapons" stays a `/damage` question. A different-weapon hit landing
        inside the run neither joins it nor breaks it.

        **`gapMs` is a CAPTURE gap — narrow with `maxGapMs`, not with
        `gapMs`.** The default 3000 is generous on purpose: truncation is
        unrecoverable downstream while over-merge is filterable. To get the
        tighter per-weapon burst your product wants, keep the rows whose
        `maxGapMs` is within that weapon's cadence (LG ≈ 1200 ms, RL ≈
        2300 ms) — every KEPT row then carries its gap-`g` value EXACTLY,
        because dropping hits from a run only widens gaps. An over-merged row
        (`maxGapMs > g`) is dropped by that filter, not truncated, and a row
        outside this response's `limit` cannot re-enter — `?gapMs=g` on this
        endpoint is the exact tighter walk when either matters. Lowering
        `gapMs` as a display knob instead loses damage: a baked 1200 ms gap truncated 11% of rl and 23% of sg bursts,
        worst measured a 291-damage triple-rocket kill reported as **2**.
        `spanMs` is the DISPLAY figure ("291 dmg in 1.7 s") and is not a valid
        narrowing rule — 21 of the 24 over-merged rl bursts in the corpus pass
        a `span <= 2×gap` test.

        **Positional kills produce no row.** A telefrag, stomp or squish
        carries no damage event, so there is no run to sum and no honest
        figure to rank by; they are absent from this ranking only (13 of 1,879
        measured kills) and still present in `/frags` and in `/damage`'s
        `telefrags` / `stomps`.

        **Kills by an already-dead killer stay in**, deliberately: the walk
        consults the VICTIM's liveness and never the killer's, so a rocket in
        flight when its shooter died still ranks. Measured 38 of 1,866 —
        posthumous rockets and mutual frags, exactly the highlights this
        endpoint exists to surface.

        **`returnDamage` is a value, not a flag.** It is what the victim dealt
        back to this killer over the `contestedMs` window before the kill —
        any weapon, same damage family. The server owns the window; the
        threshold that calls a kill "contested" is yours.

        **Ranking & filters.** Rows are ranked by `damage`, ties broken by the
        earlier kill then by killer / victim name, so the response is stable.
        `minDamage` filters on that same figure; `weapons` filters the KILLING
        weapon (burst-capable tokens only: rl, lg, gl, ssg, sng, ng, sg, axe,
        unknown — a positional or environmental cause cannot anchor a burst
        and is rejected, not silently empty); `players`
        restricts the KILLER — there is deliberately no victim-side filter,
        which would be a different question. `from`/`to` bound the KILL
        instant, not the burst: a kept row's run may reach back before `from`.

        **Errors.** 422 `top_kills_unavailable` when the demo lacks any of the
        three sources — the frag log, the damage log, or measurable liveness.
        The last is not pedantry: at the 3000 ms capture gap the walk crosses
        the victim's previous death on 4% of measured kills, and without the
        life clip those bursts absorb the victim's PREVIOUS life. Since the
        list is ranked BY damage, the contaminated rows are exactly the ones
        that reach the top, and a consumer holding only this response could
        not tell them apart. 422 `bounded_unavailable` for an EXPLICIT
        `dmg=bounded` on a demo whose bounded reconstruction was skipped; a
        defaulted one falls back to `raw` and says so in `dmg`.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/TopKillGapMs"
        - $ref: "#/components/parameters/TopKillContestedMs"
        - $ref: "#/components/parameters/TopKillLimit"
        - $ref: "#/components/parameters/Players"
        - $ref: "#/components/parameters/Weapons"
        - $ref: "#/components/parameters/MinDamage"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/DmgFamily"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The ranked kill bursts.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopKills" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/lives:
    get:
      operationId: getLives
      tags: [timeline]
      summary: Every player's lives, spawn to death
      description: |
        One row per spawn-to-death run — the natural unit of QuakeWorld
        analysis — carrying the same per-interval stats block `/top-windows`
        uses, plus `endReason`, `spawnLoc`, `deathLoc`, `killedBy`,
        `deathWeapon`, `itemsTaken` and `weaponsHeld`.

        **Segmentation & attribution.** Segmentation comes from
        `streams.players[].alive` (schema v64). Two attribution rules matter
        if you sum per-life stats:

        - a kill made POSTHUMOUSLY — a rocket landing after its shooter died,
          measured 76-197 ms later on real demos — is credited to the life
          that fired it;
        - an event on the boundary between two TOUCHING lives (a
          same-millisecond death and respawn) goes to the life that was
          ending.

        `durationMs` is ALIVE time and is not extended by the posthumous
        window.

        **What the sums reconcile against.** Every stat here is built from the
        per-event LOGS, so an unfiltered response sums, on the frag side, to
        that player's `/frags` `frags[]` rows, and on the damage side to
        `/damage`'s NON-SUMMARY aggregate for them. It does NOT sum:

        - to `/damage`'s `events[]` rows: a telefrag or stomp folds its value
          into the totals without a per-hit row of its own, so on a demo with
          any positional kill the `events[]` sum comes in low by exactly that
          fold;
        - to an unfiltered BOUNDED SUMMARY either — that response substitutes
          KTX's end-of-match scoreboard for the per-hit reconstruction these
          rows are built from;
        - and not necessarily to a scoreboard aggregate such as `/frags`'
          `byPlayer`, which has other sources — a death detected from
          `DF_DEAD` / `STAT_HEALTH` with no obituary counts there and leaves
          no log row for any life to carry.

        On `wipeout_3on2_red_vs_blue[q3dm6qw]` three players' per-life deaths
        sum to 3/4/7 against a `byPlayer` 4/5/9, and the frag log itself holds
        3/4/7 — the lives are faithful to their source.

        **One demo class breaks the identity outright**, and says so by
        reading zero. Where two wire slots resolve to the same player NAME,
        that player's per-player stream is keyed with a `#slot` suffix while
        the event logs keep the bare name, so nothing in their lives rows can
        match: every stat there — kills, deaths, damage, shots — is 0, and
        their pickups attach to no life at all rather than to the wrong
        slot's. `/top-windows` is unaffected (its subjects come from the log
        names directly).

        **`deaths` is not a 0/1 flag.** It is the count of death rows
        attributed to the life. It is usually 1; it is 0 whenever no frag-log
        row names the player at that instant, INCLUDING on lives whose
        `endReason` is `death` (four such rows on the demo above), so do not
        infer one field from the other; and it can EXCEED 1, because a life
        carries both the death that ended it and any death recorded during the
        dead gap that followed, which is the KTX `dtTELE2` deflection
        (measured across 11558 corpus lives: 12 with 2 deaths, one with 3).
        Never treat it as a 0/1 flag — read `endReason` for how the life
        ended.

        **Rates.** Each row carries its attribution window explicitly as
        `attrStart`/`attrEnd`, which is WIDER than `durationMs` (alive time
        only) — divide a count by `attrEnd − attrStart` for an exact rate.

        **Filtering.** `from`/`to` keep lives OVERLAPPING the window, not only
        those contained; note that a filtered response does NOT reconcile —
        each selected life still carries its whole attribution window, and
        `minMs` drops a life together with the events in its window. They are
        therefore not a response-size control either; that is `summary`. An
        INVERTED window (`from` > `to`) selects nothing and returns
        `lives: []`, matching `/frags`, `/damage` and `/top-windows`.

        **Measuredness.** Every numeric stat is emitted even at zero; read the
        envelope's `measured` block, never a field's absence, to tell an
        unmeasured source from a measured zero. A demo with no damage stream
        still yields lives — there, and only there, the envelope's
        `dmg`/`boundedMode` echoes are absent.

        **Errors.** 422 `lives_unavailable` when the demo carries no
        per-player streams to segment, and equally when it has streams but
        liveness was never MEASURABLE on any of them. The second case would
        otherwise serve `lives: []`, which reads as "nobody ever lived" — a
        different and false claim from "we could not tell".
        `measured.liveness` carries the same fact on the responses that do get
        served. 422 `bounded_unavailable` for an EXPLICIT `dmg=bounded` on a
        demo whose bounded reconstruction was skipped; a defaulted one falls
        back to `raw` and says so in `dmg`.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/Players"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/MinMs"
        - $ref: "#/components/parameters/DmgFamily"
        - $ref: "#/components/parameters/LivesSummary"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The lives.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lives" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/airgibs:
    get:
      operationId: getAirgibs
      tags: [timeline]
      summary: Airgib key moments
      description: >
        Every direct enemy rocket hit on an airborne victim above the
        height threshold, sorted by height descending. Empty (not an
        error) when the map's BSP was not provisioned at parse time. 422
        `airgibs_unavailable` when the demo has no timeline analysis.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The airgib list.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Airgibs" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/artifacts/{name}:
    get:
      operationId: getArtifact
      tags: [artifacts]
      summary: Generic artifact accessor
      description: |
        Materialise and serve any servable artifact by DAG node name. The
        response is a single-key envelope — the key is the artifact's
        **resultKey, NOT the node name**.

        - Accepts NO query parameters (parameterised reads are the curated
          endpoints) — any parameter returns 400 invalid_param.
        - Unknown / non-servable names 404 artifact_unknown.
        - Capability-gated artifacts return their section-specific 422 code.
        - ETag is the finer per-artifact form `"<sha>-<name>@v<n>"`.

        | DAG node | curated route | body key (resultKey) | when the demo lacks it |
        |---|---|---|---|
        | demoinfo | /demoinfo | demoInfo | 422 demoinfo_unavailable |
        | frag | /frags | frags | 422 frags_unavailable |
        | metadata | /metadata | metadata | 422 metadata_unavailable |
        | match | — (feeds /overview) | match | 200, null body value |
        | messages | /chat (filtered view) | messages | 200, null body value |
        | timeline | — (feeds /events, /buckets, /region-control) | timelineAnalysis | 200, null body value |
        | items | /items (filtered view) | items | 200, null body value |
        | damage | /damage | damage | 422 damage_unavailable |
        | shots | /shots | shots | 422 shots_unavailable |
        | map-entities | /v1/maps/{map}/entities (per-map form) | mapEntities | 200, null body value |
        | backpacks | /backpacks (filtered view) | backpacks | 200, null/[] |
        | weapon-pickups | /weapon-pickups (filtered view) | weaponPickups | 200, null/[] |
        | aim | /aim | aim | 422 aim_unavailable |
        | loc-graph | /loc-graph | locGraph | 422 locgraph_unavailable |
        | opening | — (artifact only) | opening | 422 opening_unavailable |
        | player-stats | /player-stats | playerStats | 422 playerstats_unavailable (only a degraded no-streams parse; a missing KTX block is served normally) |
        | los | /los | — (serves the /los body, no envelope key) | 422 los_unavailable (map has no usable visibility BSP) |
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/ArtifactName"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: Single-key artifact envelope.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactEnvelope" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Unknown demo (`demo_not_found`) or unknown/non-servable artifact name (`artifact_unknown`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/games/search:
    get:
      operationId: searchGames
      tags: [demo]
      summary: Search the hub game catalog
      description: |
        Discovery over hub.quakeworld.nu's public game catalog — no demo is
        involved. Filter by player names, teams, map, mode, matchtag, or date
        range; the newest matches come back when no filter is given. Feed a
        result's `gameId:<id>` to any per-demo endpoint to analyse it.

        **Paging.** `count` is rows in THIS page, `total` (when the hub
        reports it) is all matching rows — page with limit/offset until
        offset+count >= total.

        **Row shape.** Rows are compact by default (each player projected to
        {name, team, frags}); `roster=true` returns the verbatim hub rows
        (per-player ping, colors, is_bot).

        **Caching.** This endpoint proxies a live upstream, so it is not
        cached and can 502 `hub_upstream`.
      parameters:
        - $ref: "#/components/parameters/SearchPlayers"
        - $ref: "#/components/parameters/SearchTeams"
        - $ref: "#/components/parameters/SearchMap"
        - $ref: "#/components/parameters/SearchMode"
        - $ref: "#/components/parameters/SearchMatchtag"
        - $ref: "#/components/parameters/SearchFrom"
        - $ref: "#/components/parameters/SearchTo"
        - $ref: "#/components/parameters/SearchLimit"
        - $ref: "#/components/parameters/SearchOffset"
        - $ref: "#/components/parameters/SearchRoster"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The matching page of games.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GamesSearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/HubUpstream" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/maps/{map}/entities:
    get:
      operationId: getMapEntitiesByMap
      tags: [maps]
      summary: Static map entity layout
      description: >
        Items, spawns, teleporters, buttons, doors for a map from the
        embedded corpus — no demo needed, identical for every demo on the
        map (a caller holding a demo id reads the map name from /overview
        first; the per-match pickup timeline is /items). ETag
        `"ents-<map>-v<corpusVersion>"`.
      parameters:
        - $ref: "#/components/parameters/MapName"
        - $ref: "#/components/parameters/EntityTypes"
        - $ref: "#/components/parameters/Kinds"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The entity list.
          headers: &mapStaticHeaders
            ETag: { $ref: "#/components/headers/ETag" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapEntities" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/MapUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/maps/{map}/geometry:
    get:
      operationId: getMapGeometry
      tags: [maps]
      summary: Per-map floor-polygon geometry
      description: >
        Streams the per-map floor-polygon geometry JSON (large; REST-only,
        no MCP tool). 404 `map_unavailable` when geometry is not
        provisioned on this server or unknown for the map. ETag
        `"geo-<map>-<size>"`.
      parameters:
        - $ref: "#/components/parameters/MapName"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The geometry document.
          headers: *mapStaticHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapGeometry" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/MapUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
components:
  securitySchemes:
    bearerKey:
      type: http
      scheme: bearer
      description: >
        API key as `Authorization: Bearer <key>`. Required only when the
        server runs in auth mode (the hosted deployment); localhost /
        no-auth mode accepts every request and treats the header as an
        unvalidated source label for the access log. Exempt even in auth
        mode: /healthz, /v1/version, /openapi.yaml, /docs.
  parameters:
    Label:
      name: label
      in: query
      required: false
      description: >
        Non-secret traffic-source tag for access-log attribution. Accepted on
        every endpoint; never affects the response.
      schema: { type: string }
    DemoId:
      name: id
      in: path
      required: true
      description: >
        Demo identity: `gameId:N` (a hub.quakeworld.nu game id, positive
        integer) or `sha:HEX` (lowercase-insensitive 64-hex SHA-256 of the
        demo file). Every per-demo endpoint auto-resolves and auto-loads
        on cache miss.
      schema:
        type: string
        pattern: "^(gameId:[0-9]+|sha:[0-9a-fA-F]{64})$"
      examples:
        byGameId: { value: "gameId:145060" }
        bySha: { value: "sha:ffda58010f3ab43c020dfd267dd90ba6775ec8e6f0b969ade82ca15d9162f57d" }
    ArtifactName:
      name: name
      in: path
      required: true
      description: >
        DAG node name of a servable artifact (see GET /v1/artifacts).
        Note the body key of the response is the artifact's `resultKey`,
        which may differ from this name.
      schema:
        type: string
        enum:
          # artifact-enum:begin — pinned to analyzer.ArtifactManifest() (servable only) by TestOpenAPIArtifactEnumCurrent
          - demoinfo
          - frag
          - metadata
          - match
          - messages
          - timeline
          - items
          - damage
          - shots
          - map-entities
          - backpacks
          - weapon-pickups
          - aim
          - loc-graph
          - opening
          - player-stats
          - los
          # artifact-enum:end
    MapName:
      name: map
      in: path
      required: true
      description: Map name, e.g. `dm3` (normalized server-side).
      schema: { type: string }
    From:
      name: from
      in: query
      description: >
        Window start, match-relative integer MILLISECONDS. 0 / omitted = no
        lower bound. Endpoints treat the window as inclusive on both ends.
        A non-integer value 400s with code `invalid_param` and an `(integer
        milliseconds)` hint.
      schema: { type: integer, minimum: 0 }
    To:
      name: to
      in: query
      description: >
        Window end, match-relative integer MILLISECONDS. 0 / omitted = no
        upper bound. A non-integer value 400s with code `invalid_param` and
        an `(integer milliseconds)` hint.
      schema: { type: integer, minimum: 0 }
    PlayerStatsTeams:
      name: teams
      in: query
      description: >
        CSV of team names. Case-SENSITIVE. Restricts both the player rows
        and the team aggregate rows. Omit for all teams.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    Players:
      name: players
      in: query
      description: >
        CSV of player display names. Case-SENSITIVE (QW names are
        case-significant). Omit for all players. Filter semantics are
        per-endpoint (e.g. killer-or-victim on /frags, speaker on /chat).
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    Weapons:
      name: weapons
      in: query
      description: |
        CSV of weapon codes (case-insensitive). Core codes: rl, lg, gl, ssg,
        sng, ng, sg, axe; on /damage the pseudo-codes tele/stomp select the
        positional instant kills (which carry no real weapon).

        Each endpoint validates against its OWN closed vocabulary and returns
        400 `invalid_param` (listing the valid set) for an unknown token — no
        more silent empty result:

        - **/frags** additionally accepts the obituary environmental / cause
          codes (hook, rail, squish, fall, lava, slime, water, world, tele,
          stomp, unknown, suicide, teamkill);
        - **/damage** the death-type + environmental codes (explobox, squish,
          lava, slime, drown, fall, trigger, suicide, unknown);
        - **/backpacks** accepts rl/lg only;
        - **/weapon-pickups** ssg,ng,sng,gl,rl,lg;
        - **/top-kills** filters the KILLING weapon (which is also the
          burst's own weapon) and accepts only the burst-capable subset —
          the core codes plus `unknown`. Positional (tele/stomp/squish),
          environmental and bookkeeping causes are REJECTED here: no damage
          event can anchor them, so the token would be a valid filter that
          structurally selects nothing.

        `water` and `drown` are the SAME cause under the two logs' different
        spellings and are accepted interchangeably wherever either is valid,
        so you need not know which log backs the endpoint you are calling.

        The pre-16.2 singular spelling `weapon` is an accepted legacy alias;
        `weapons` wins when both are present.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    WeaponsLegacy:
      name: weapon
      in: query
      deprecated: true
      description: >
        Deprecated legacy alias of `weapons` (the pre-16.2 singular
        spelling). Ignored when `weapons` is present.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    ShotsNails:
      name: nails
      in: query
      deprecated: true
      description: >
        Deprecated no-op. The retired opt-in that once gated ng/sng nail
        linking; ng/sng fires are always in the stream now. Accepted and
        ignored so old callers do not 400.
      schema: { type: string }
    Summary:
      name: summary
      in: query
      description: >
        `1`/`true` drops the big per-event log / sample arrays / phase
        timeline and returns only the aggregates.
      schema: { type: boolean }
    ItemsFilter:
      name: items
      in: query
      description: >
        CSV restricting to items whose Name or Kind matches
        (case-insensitive). A kind token matches every instance ("ya" →
        ya_1, ya_2); an instance name ("ya_1") matches one.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    Kinds:
      name: kinds
      in: query
      description: >
        CSV of item categories — armor, mega, health, powerup, weapon,
        ammo — or raw kind tokens (ra, quad). Case-insensitive.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    Source:
      name: source
      in: query
      description: Restrict weapon pickups by provenance.
      schema:
        type: string
        enum: [world, backpack, unknown]
    ChatTypes:
      name: types
      in: query
      description: >
        CSV of message types; defaults to `chat,teamsay`. Pass a subset to
        narrow. An unknown value 400s (invalid_param).
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - chat
            - teamsay
    EventTypes:
      name: types
      in: query
      description: >
        CSV of event types: frag, powerup, streak, spawn, death, weapon,
        item, chat, pickup (the default set), plus the opt-in
        high-frequency / dedicated lenses damage, health, armor, loc,
        telefrag, stomp. Omit for the default set. An unknown type value
        400s (invalid_param) rather than silently matching nothing.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            # event-type-enum:begin — pinned to view.KnownEventTypes by TestOpenAPIEventTypesCurrent
            - frag
            - powerup
            - streak
            - spawn
            - death
            - weapon
            - item
            - chat
            - pickup
            - demomark
            - airgib
            - pause
            - damage
            - telefrag
            - stomp
            - health
            - armor
            - loc
            # event-type-enum:end
    EntityTypes:
      name: types
      in: query
      description: >
        CSV of entity types: item, spawn, teleportDst, teleportSrc,
        button, door.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    Fields:
      name: fields
      in: query
      description: >
        CSV of field selector codes. Omit for the default set (everything
        except the opt-in view/hgt/lq/vel). NOTE: the selector code `li`
        renders as output key `loc` in name mode — `loc` is NOT a selector
        code. Unknown codes 400 with the full vocabulary enumerated.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            # field-code-enum:begin — pinned to view/fields.go by TestOpenAPIFieldCodesCurrent
            - h
            - a
            - at
            - li
            - pos
            - view
            - hgt
            - lq
            - vel
            - rl
            - lg
            - gl
            - ssg
            - sng
            - q
            - pe
            - r
            - sh
            - nl
            - rk
            - cl
            - sp
            - d
            # field-code-enum:end
    Loc:
      name: loc
      in: query
      description: >
        Loc rendering — `name` (default) resolves loc indices to names;
        `index` returns raw LocTable indices (decode via /loc-table).
      schema:
        type: string
        enum: [name, index]
    Layout:
      name: layout
      in: query
      description: >
        /buckets response layout — `column` (default, compact columnar
        grid) or `row` (row objects).
      schema:
        type: string
        enum: [column, row]
    Metric:
      name: metric
      in: query
      description: >
        What a top window is ranked by — any SUMMABLE per-event quantity.
        Ratios (accuracy, efficiency) are deliberately absent: they do not sum,
        so "the best window" is undefined for them; they ride the per-window
        stats block instead. `netFrags` (kills − deaths) is usually what people
        mean by hot — five kills bought with four deaths is a trade, not a run.
        `deaths` finds a player's WORST stretch. Case-insensitive.

        **`shots`/`hits` want a `weapons=` filter.** A "shot" is one discrete
        fire (an LG beam tick and a rocket each count 1), so the unfiltered
        sum is dominated by fast-cycling weapons; and hits are counted only
        for weapons whose fires LINK to damage (sg/ssg/lg always, rl/gl via
        projectile tracking, ng/sng only when nail decoding ran), so the
        unfiltered figure mixes measured and unmeasured weapons. A rocket's
        SPLASH is a hit — including a rocket jump's self-splash (KTX-accuracy
        parity; the stats split it out as selfHits) — so for RL windows
        `metric=damageGiven&weapons=rl` is the quality signal (enemy-only by
        definition), while `metric=hits&weapons=lg` is the LG tracking signal
        (each cell counts the same; raw damage ≈ 30×hits, bounded discounts
        the killing cell's overkill).
      schema:
        type: string
        default: frags
        enum:
          # top-window-metric-enum:begin — TestOpenAPITopWindowMetricsCurrent pins this to view.KnownTopWindowMetrics
          - frags
          - deaths
          - netFrags
          - damageGiven
          - damageTaken
          - netDamage
          - shots
          - hits
          # top-window-metric-enum:end
      example: netFrags
    TopWindowMode:
      name: mode
      in: query
      description: |
        The SEGMENTATION — how a window's boundaries are decided (default
        `fixed`, so a request written before this parameter existed is
        unchanged). Case-insensitive; the resolved value is echoed on every
        response, `fixed` ones included.

        - `fixed` — every window is exactly `windowMs` long. "In these
          `windowMs` ms this player scored higher on `metric` than in any
          other stretch of the same length."
        - `gap` — a window is a maximal run of scoring events in which
          consecutive events are no more than `gapMs` apart; its score is
          their sum. The stretch lasts as long as the player kept doing it,
          not as long as a stopwatch says. A gap of EXACTLY `gapMs` joins and
          `gapMs+1` splits; a run of one event is a legitimate window with
          `durationMs` 0.

        Each mode takes exactly ONE knob and REJECTS the other's with a 400
        rather than ignoring it: `gapMs` under `mode=fixed`, and `windowMs`
        under `mode=gap`. `gapMs` is REQUIRED under `mode=gap` and has no
        default.

        Gap-mode specifics worth knowing before you read the rows:

        - Signed metrics (`netFrags`, `netDamage`) cluster on ALL their
          events, negatives included — a death both extends the run and
          lowers its score. That is "net" as the fight went, and it is what
          keeps `score` equal to the same-named stat.
        - A cluster MAY SPAN THE PLAYER'S OWN DEATH (kill, die, respawn, kill
          again within `gapMs` is one window). `/lives` is the per-life view.
        - Clusters are disjoint per player by construction, so unlike fixed
          mode there is no overlap suppression to reason about.
        - `from`/`to` still bound where a window may START — here, its first
          event; the run may end past `to`. Note the consequence on the
          `from` side: a cluster whose first event precedes `from` is not
          returned AT ALL, its post-`from` mass included — `from` never
          re-anchors a cluster. Slicing a match into `from`/`to` panes
          therefore drops straddling clusters rather than truncating them.
      schema:
        type: string
        default: fixed
        enum:
          # top-window-mode-enum:begin — TestOpenAPITopWindowModesCurrent pins this to view.KnownTopWindowModes
          - fixed
          - gap
          # top-window-mode-enum:end
      example: gap
    TopWindowGapMs:
      name: gapMs
      in: query
      description: |
        Gap mode's knob, in integer MILLISECONDS: consecutive scoring events
        no more than `gapMs` apart belong to the same window.

        **REQUIRED under `mode=gap`, with deliberately NO default** — omitting
        it is a 400. The metrics' event cadences are too far apart for one
        value to serve them: measured over the 44-demo corpus, per-player
        inter-KILL gaps run p50 ≈ 11-12 s while inter-damage-event gaps run
        p50 ≈ 1.0-1.1 s, so the value that reads as "a streak" on frags
        dissolves damage into phase-length blobs, and the value that reads as
        "a rampage" on damage leaves 85% of RL frag clusters singletons.
        Requiring it also keeps the mode honest: you state what "kept doing
        it" means rather than inheriting a constant nobody can justify.

        **Measured starting points: ~10000 for the frag metrics
        (`frags`/`deaths`/`netFrags`), ~3000 for the damage and shot
        metrics.** At `metric=frags` a gap of 8000-15000 reads as a streak
        (top clusters 18-22 kills); at `metric=damageGiven` a gap of
        2000-3000 reads as a rampage (~900 damage over 13-21 s) and 8000
        already merges whole map phases.

        **Range 1..the match duration**, `windowMs`' rule exactly, and an
        out-of-range value is REJECTED with a 400 naming the bound rather than
        clamped. The floor covers an explicit `gapMs=0` (an omitted MCP
        integer arrives as 0, which must not look deliberate) and any negative
        value; the ceiling is the match duration, past which every one of a
        player's events joins a single window.

        **Rejected under `mode=fixed`** with a 400 — an explicit conflict, not
        a silent drop, since the response echoes only its own mode's knob and
        so could not show that anything was discarded.
      schema: { type: integer, format: int32, minimum: 1 }
      example: 3000
    TopWindowMs:
      name: windowMs
      in: query
      description: |
        FIXED MODE'S knob: the window length in integer MILLISECONDS (default
        30000). 5000 gives damage bursts, 30000 hot streaks, 120000 map-phase
        dominance. Sweep it — there is no single right value and the API does
        not pick one for you.

        **Rejected under `mode=gap`** with a 400 (that mode's knob is
        `gapMs`), and absent from a gap response, where a fixed length would
        be a lie.

        **Bounded on both sides**, and an out-of-range value is REJECTED with
        a 400 naming the bound rather than clamped.

        - The floor is 1 (`windowMs=0` and any negative value alike; omit the
          parameter for the default).
        - The CEILING IS THE MATCH DURATION — see `/overview`'s `matchEnd` —
          because a window at least that long is simply the whole match, and a
          longer one would break the `end = start + windowMs` identity every
          row is documented by (the response would have to clamp `end`,
          leaving a `durationMs` covering time that does not exist).
      schema: { type: integer, format: int32, minimum: 1, default: 30000 }
      example: 30000
    TopWindowLimit:
      name: limit
      in: query
      description: |
        Total windows returned across all players (default 10, max 200).
        Applied AFTER `perPlayer`. A NEGATIVE value means uncapped.

        Out-of-range values are REJECTED with a 400, never silently clamped: an
        explicit `limit=0` (0 cannot mean "uncapped" — an omitted MCP integer
        arrives as 0, which would make a forgotten argument look deliberate)
        and any `limit` above the 200 maximum.
      schema: { type: integer, default: 10, maximum: 200 }
      example: 10
    PerPlayer:
      name: perPlayer
      in: query
      description: |
        Maximum windows contributed by any ONE player. Applied BEFORE `limit`,
        so `perPlayer=3&limit=10` is "the top 10 with at most 3 from anyone".
        Set it to spread a leaderboard across the roster; omit it for a pure
        match-wide ranking in which one dominant player may own every row.

        **Name-keyed.** The cap is keyed on the player NAME, so a human the
        server scored as two players (a reconnect renamed `(N)<name>`) can
        occupy twice the quota. `/player-stats`' `identity` is what lets you
        detect that — two names, one identity; the cap itself is deliberately
        left name-keyed.

        **Same rule as `limit`, deliberately:** omitted is the default
        (uncapped), a NEGATIVE value means uncapped, and an explicit
        `perPlayer=0` is REJECTED with a 400 — an omitted MCP integer arrives
        as 0, and 0 must not make a forgotten argument look like a deliberate
        one.
      schema: { type: integer, default: 0 }
      example: 3
    MinScore:
      name: minScore
      in: query
      description: >
        Drop windows scoring below this many points OF THE CHOSEN METRIC
        (default 1) — a score threshold, not a duration; the ms-valued filter
        on the sibling `/lives` is `minMs`. Matters most for the net metrics,
        which can go negative — a window nobody would call hot. An explicit
        `minScore=0` is a MEANINGFUL request (keep the windows that broke even)
        and is honoured, not treated as "unset".
      schema: { type: integer, default: 1 }
    TopKillGapMs:
      name: gapMs
      in: query
      description: |
        The burst walk's CAPTURE gap, in integer MILLISECONDS (default 3000,
        max 5000): a hit joins the run while it lands within `gapMs` of the
        run's earliest hit so far.

        **Do not lower this to get tighter bursts** — filter the response by
        `maxGapMs` instead. The default is generous because truncation is
        unrecoverable downstream while over-merge is filterable, and keeping
        the rows with `maxGapMs <= g` gives every KEPT row its gap-`g` value
        EXACTLY. A run with `maxGapMs > g` is dropped by that filter, not
        truncated — the true gap-`g` walk would report its shorter suffix
        instead — so the narrowed list is the gap-`g` ranking restricted to
        intact runs. A baked 1200 ms gap truncated 11% of rl and 23% of sg
        bursts. The parameter exists for the exact server-side recompute
        (`gapMs=g` when the truncated remainders matter), not as the display
        knob.

        Out-of-range values are REJECTED with a 400 naming the range, never
        clamped: below 1 (including an explicit `gapMs=0` — an omitted MCP
        integer arrives as 0, which must not look deliberate) and above 5000,
        beyond which a "burst" is two fights. The resolved value is echoed on
        the response.
      schema: { type: integer, format: int32, minimum: 1, maximum: 5000, default: 3000 }
      example: 3000
    TopKillContestedMs:
      name: contestedMs
      in: query
      description: >
        The window each row's `returnDamage` sums the victim's damage back
        over, in integer MILLISECONDS before the kill (default 4000, max
        30000). It sets the WINDOW only — `returnDamage` is a value, not a
        flag, so the threshold that calls a kill "contested" stays yours.
        Out-of-range values (below 1, including an explicit 0, or above 30000)
        are REJECTED with a 400 naming the range. The resolved value is echoed
        on the response.
      schema: { type: integer, format: int32, minimum: 1, maximum: 30000, default: 4000 }
      example: 4000
    TopKillLimit:
      name: limit
      in: query
      description: >
        Rows returned (default 20, max 200). A NEGATIVE value means uncapped.
        Out-of-range values are REJECTED with a 400, never silently clamped:
        an explicit `limit=0` (0 cannot mean "uncapped" — an omitted MCP
        integer arrives as 0, which would make a forgotten argument look
        deliberate) and any `limit` above the 200 maximum. The default is 20
        rather than `/top-windows`' 10 because the per-weapon `maxGapMs`
        narrowing this endpoint expects thins the list.
      schema: { type: integer, default: 20, maximum: 200 }
      example: 20
    MinDamage:
      name: minDamage
      in: query
      description: >
        Drop kill bursts below this much burst damage (default 0, keep all) —
        the same figure the rows are ranked by, in the resolved `dmg` family.
        A negative value is rejected with a 400: 0 already means "no filter",
        since a burst's damage is non-negative.
      schema: { type: integer, minimum: 0, default: 0 }
      example: 150
    MinMs:
      name: minMs
      in: query
      description: >
        Drop lives shorter than this many integer milliseconds (default 0, keep
        all). Useful for filtering out spawn-frag lives.
      schema: { type: integer, format: int32, minimum: 0, default: 0 }
      example: 1000
    RegionsMode:
      name: regions
      in: query
      description: |
        Region-list detail on /region-control.

        - `full` (default, backward-compatible) — the whole ControlRegion list
          including each region's polygon `points` (~6 KB, needed only to draw
          the map overlay).
        - `summary` — regions with `points` stripped (`name`, `locs`,
          `centroidX`/`centroidY` kept), for stats-only consumers.
        - `none` — the `regions` list is omitted from the response entirely.

        `bucketStates` and `stats` are identical across all three.
      schema:
        type: string
        enum: [full, summary, none]
    Dmg:
      name: dmg
      in: query
      description: |
        Damage family (schema v55).

        - `raw` — the unbound wire values in the v53 field layout, with v54
          fold semantics (given/taken include the telefrag/stomp folds on
          standard demos; the kill entries keep their fold fields and
          boundedMode survives).
        - `bounded` — KTX-scoreboard semantics (armor absorbed + health capped
          to remaining) materialized into the same field names; an EXPLICIT
          `dmg=bounded` is a 422 `bounded_unavailable` on midair / instagib /
          dmgfrags demos, whose server mode makes the reconstruction
          impossible.
        - `both` — the raw fields plus per-player `bounded` nests and a
          per-event `bounded`.

        Default (unset): `bounded`, for both `summary=true` and the full log —
        a defaulted bounded on a skipped:* demo falls back to `raw` rather
        than 422.
      schema:
        type: string
        enum: [raw, bounded, both]
    DmgFamily:
      name: dmg
      in: query
      description: |
        Damage family for the on-demand damage endpoints (`/top-windows`,
        `/lives`, `/top-kills`):

        - `raw` — the unbound wire values;
        - `bounded` — KTX-scoreboard semantics (armor absorbed + health capped
          to remaining).

        Default (unset): `bounded`, falling back to `raw` on a demo whose
        bounded reconstruction was skipped; an EXPLICIT `dmg=bounded` there is
        a 422 `bounded_unavailable` naming the demo's `boundedMode`.

        **On the interval endpoints it selects the family of the whole STATS
        BLOCK**, so it applies under EVERY `/top-windows` metric and not only
        the damage ones — a window picked by `metric=frags` still reports
        `damageGiven`, and that number has a family. Both rules above hold
        under every metric too: the skipped-demo 422 fires for an explicit
        `dmg=bounded` whatever the metric, and a defaulted one falls back to
        `raw` whatever the metric. On `/top-kills` it selects the family of
        both `damage` and `returnDamage`, so one response is one family there
        too — and since `damage` is the RANKING key, the two families can
        order the list differently. The resolved family comes back as the
        response's own `dmg` — read it rather than assuming the default took.

        **Two values, not three:** `both` is a response SHAPE — raw fields
        plus a parallel `bounded` nest, as `/damage` returns it — and these
        endpoints have no such shape. One interval stats block — one kill
        burst — carries one set of damage numbers, and a quantity that RANKS
        has to rank on a single family, so `both` is rejected with a 400 here
        for every metric and on every one of the three endpoints.
      schema:
        type: string
        enum: [raw, bounded]
    LivesSummary:
      name: summary
      in: query
      description: |
        Size control. `/lives` returns one row per spawn-to-death run and a
        whole 4on4 match is ~400 of them (~240 KB), of which ~40% is per-row
        collections. Note that `from`/`to` only SELECT rows here — each kept
        row still carries its whole attribution window — so they are not a
        size control on their own.

        **What `summary=true` keeps:** EVERY ROW and every scalar (the counts,
        the durations, `endReason`, `spawnLoc`/`deathLoc`,
        `killedBy`/`deathWeapon`, `mainWeapon`, `weaponsHeld`).

        **What it drops:** the per-row breakdown collections — `itemsTaken`,
        `locs`, `eventLocs`, `victims`, `byWeapon`, `damageByWeapon`.

        **One consequence to know:** `itemsTaken` is `null` on every summary
        row. In a summary response that null means "not requested" and says
        NOTHING about the demo — the envelope's `measured.items` remains the
        authority on whether an item timeline exists. Re-ask with
        `summary=false` (plus `players` / `from` / `to`) for the detail of the
        lives you care about.
      schema: { type: boolean, default: false }
    Reducers:
      name: reducers
      in: query
      description: >
        CSV of `field=reducerName` pairs overriding the per-field default
        reducer, e.g. `reducers=h=min,a=last`. Registry: first (default
        for most fields — value at window start), last, mean, min, max,
        dominant (most common value), held-any, majority, any. Unknown
        names 400.
      schema: { type: string }
    IncludeTeam:
      name: includeTeam
      in: query
      description: Include each player's team in the bucket envelope.
      schema: { type: boolean }
    WindowMs:
      name: windowMs
      in: query
      description: >
        Window size, integer MILLISECONDS. ⚠️ Defaults to 50 ms — on a
        20-minute match that is ~24,000 windows per field per player.
        Always pass a windowMs sized to your question. All time params are
        ms: windowMs, from, and to alike. Omit it for the default; an
        explicit windowMs=0 is rejected with 400 invalid_param.
      schema:
        type: integer
        default: 50
        minimum: 1
    MinDwellMs:
      name: minDwellMs
      in: query
      description: >
        Fold loc residences shorter than this many milliseconds into the
        preceding residence. The fold never crosses a gap, so a residence
        that follows a dead span (or an unresolved stretch) survives even
        when shorter than the threshold. Default 0 = no filter.
      schema:
        type: integer
        minimum: 0
    TimeRequired:
      name: time
      in: query
      required: true
      description: >
        The instant to sample, match-relative integer MILLISECONDS. A
        non-integer value 400s with code `invalid_param` and an `(integer
        milliseconds)` hint.
      schema: { type: integer, minimum: 0 }
    SearchPlayers:
      name: players
      in: query
      description: >
        CSV of player names to match (full-text search on the roster,
        AND'd across multiple names). Case-INsensitive: the hub matches via
        PostgREST full-text search, which lowercases both the query and the
        indexed names (`to_tsvector`), so `bps` and `BPS` match the same
        games. This differs from the per-demo endpoints' `players` filter,
        which is an exact, case-sensitive name match.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    SearchTeams:
      name: teams
      in: query
      description: >
        CSV of team names that must all appear in the game's team list
        (contains).
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    SearchMap:
      name: map
      in: query
      description: Map name, exact match (e.g. `dm6`).
      schema: { type: string }
    SearchMode:
      name: mode
      in: query
      description: Game mode, exact match (e.g. `1on1`, `2on2`, `4on4`, `FFA`).
      schema: { type: string }
    SearchMatchtag:
      name: matchtag
      in: query
      description: >
        Tournament / event tag, case-insensitive substring (e.g. `qwsl`).
        Documented casing exception: the param name is the lowercase single
        word `matchtag` (mirroring the KTX serverinfo key), not camelCase like
        the other multi-word query params.
      schema: { type: string }
    SearchFrom:
      name: from
      in: query
      description: >
        Calendar date lower bound, inclusive. Strict `YYYY-MM-DD` (exactly
        10 characters, a real date); a malformed value is rejected with
        `400 invalid_param` at the API boundary (it no longer reaches the
        hub as a `502 hub_upstream`). NOTE these are calendar dates that
        select which games to list — unrelated to the per-demo endpoints'
        `from`/`to`, which are match-relative times bounding a window
        within one demo.
      schema: { type: string }
    SearchTo:
      name: to
      in: query
      description: >
        Calendar date upper bound, inclusive (the whole end day is
        included). Strict `YYYY-MM-DD` (exactly 10 characters, a real
        date); a malformed value is rejected with `400 invalid_param` at
        the API boundary (it no longer reaches the hub as a `502
        hub_upstream`). NOTE these are calendar dates that select which
        games to list — unrelated to the per-demo endpoints' `from`/`to`,
        which are match-relative times bounding a window within one demo.
      schema: { type: string }
    SearchLimit:
      name: limit
      in: query
      description: >
        Max rows per page. Omit for the default 20. An explicit `limit=0`
        is distinguishable from an absent one and is rejected with `400
        invalid_param` (omit the param for the default instead); a value
        above 100 or a negative value is likewise rejected — no longer
        silently clamped.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    SearchOffset:
      name: offset
      in: query
      description: >
        Pagination offset (number of rows to skip). A negative value is
        rejected with `400 invalid_param`.
      schema:
        type: integer
        minimum: 0
    SearchRoster:
      name: roster
      in: query
      description: >
        `1`/`true` returns the verbatim hub rows (per-player ping, color
        arrays, name_color, is_bot); default returns compact rows with each
        player projected to {name, team, frags}.
      schema: { type: boolean }
  headers:
    ETag:
      description: >
        Strong validator. Per-demo `"<sha>-v<schemaVersion>"`; per-artifact
        `"<sha>-<name>@v<n>"`; binary-static `"<kind>-v<n>"`; map-static
        `"ents-<map>-v<n>"` / `"geo-<map>-<size>"`; spec/docs content hash.
      schema: { type: string }
    XCache:
      description: Which cache tier served the demo — HIT, WARM, or MISS.
      schema:
        type: string
        enum: [HIT, WARM, MISS]
    XSchemaVersion:
      description: result.CurrentSchemaVersion of the serving binary.
      schema: { type: string }
    XRequestId:
      description: >
        Per-request id echoed in the server access log; quote it when
        reporting a problem.
      schema: { type: string }
  responses:
    NotModified:
      description: >
        Not Modified — the If-None-Match validator matched; the cached
        representation is current.
    BadRequest:
      description: >
        Malformed `{id}` (`invalid_demo_id`), malformed or rejected query
        parameter (`invalid_param`), or required parameter absent
        (`missing_param`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: >
        Auth mode only — missing / invalid / revoked API key
        (`unauthorized`). Carries `WWW-Authenticate: Bearer`. The body is
        deliberately generic.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    DemoNotFound:
      description: The hub has no row for this gameId (`demo_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    MapUnavailable:
      description: >
        No entity corpus / geometry for this map (`map_unavailable`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unavailable:
      description: >
        The demo structurally lacks the signal this section needs
        (`<section>_unavailable` — the operation description names the
        specific code). Expected for some demos; treat as "panel
        unavailable", not failure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: >
        Auth mode only — per-key rate limit exceeded (`rate_limited`).
        Carries `Retry-After` (seconds); wait and retry.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    HubUpstream:
      description: Network error / 5xx from the hub (`hub_upstream`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Internal:
      description: >
        Unexpected server error (`internal`). The body is generic — a
        fixed message plus the request id; the real error is logged
        server-side keyed by X-Request-Id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    ErrorEnvelope:
      type: object
      description: Stable error envelope for every non-2xx JSON response.
      required: [error]
      additionalProperties: false
      properties:
        error:
          description: "Error object (code + message)."
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: >
                Human-readable and user-actionable for 4xx; generic (request
                id only) for 5xx.
    ErrorCode:
      type: string
      description: Machine-readable error class.
      enum:
        # error-code-enum:begin — pinned to the writeError/writeUnavailable call sites by TestOpenAPIErrorCodesCurrent
        - aim_unavailable
        - airgibs_unavailable
        - artifact_unknown
        - bounded_unavailable
        - damage_unavailable
        - demo_not_found
        - demo_too_large
        - demoinfo_unavailable
        - frags_unavailable
        - hub_upstream
        - internal
        - invalid_demo_id
        - invalid_gzip
        - invalid_param
        - lives_unavailable
        - locgraph_unavailable
        - los_unavailable
        - map_unavailable
        - metadata_unavailable
        - missing_param
        - opening_unavailable
        - playerstats_unavailable
        - rate_limited
        - region_control_unavailable
        - shots_unavailable
        - top_kills_unavailable
        - top_windows_unavailable
        - unauthorized
        - unknown_param
        - unparseable_demo
        - upload_quota_exceeded
        - uploads_disabled
        # error-code-enum:end
    TimeUnit:
      type: string
      description: >
        The unit of a governed response's time values (schema v57): always
        `ms` (int32 milliseconds). In the pure-ms model there is only one
        unit, so this echo is a constant `"ms"` self-description present so
        the body is self-describing. This shared component is referenced by
        the schemas reused across the raw /artifacts envelope
        (Frags/Damage/Shots/ItemsTimelines); the value is invariant.
      enum: [ms]
    Health:
      type: object
      required: [ok, schemaVersion]
      additionalProperties: false
      properties:
        ok: { type: boolean, description: "Service healthy." }
        schemaVersion: { type: integer, description: "Result schema version this response was produced under." }
    Version:
      type: object
      required: [hash, tag, buildDate]
      additionalProperties: false
      properties:
        hash: { type: string, description: Git commit hash of the build. }
        tag: { type: string, description: Git tag, if any. }
        buildDate: { type: string, description: "Build date." }
    LoadResult:
      type: object
      required: [demoId, sha256, fromCache, schemaVersion]
      additionalProperties: false
      properties:
        demoId:
          type: string
          description: Canonical `sha:HEX` id — use it for subsequent calls.
        sha256: { type: string, description: "Demo SHA-256." }
        fromCache: { type: boolean, description: "The result was served from cache." }
        schemaVersion: { type: integer, description: "Result schema version this response was produced under." }
    ArtifactsManifest:
      type: object
      required: [schemaVersion, artifacts]
      additionalProperties: false
      properties:
        schemaVersion: { type: integer, description: "Result schema version this response was produced under." }
        artifacts:
          description: "DAG node manifest entries."
          type: array
          items: { $ref: "#/components/schemas/ArtifactMeta" }
    ArtifactMeta:
      type: object
      description: One analyzer DAG node, as listed in ARTIFACTS.md.
      required: [name, mutates, lazy, cost, servable]
      additionalProperties: false
      properties:
        name: { type: string, description: DAG node name. }
        requires:
          description: "Upstream nodes this node depends on."
          type: [array, "null"]
          items: { type: string }
        provides:
          description: "Result sections this node provides."
          type: [array, "null"]
          items: { type: string }
        mutates: { type: boolean, description: "Result sections this node mutates." }
        lazy: { type: boolean, description: "Materialised on demand (not in the base parse)." }
        cost:
          description: "Materialisation cost class."
          type: string
          enum: [light, heavy]
        resultKey:
          type: string
          description: >
            Top-level Result JSON key (the generic artifact endpoint's body
            key). Empty = internal / no direct section.
        servable: { type: boolean, description: "Exposed via GET /v1/demos/{id}/artifacts/{name}." }
        description: { type: string, description: "Human-readable description." }
    GamesSearchResult:
      type: object
      description: >
        One page of hub game-catalog matches (GET /v1/games/search). The
        game rows are passed through from the hub verbatim (roster=true) or
        with each player compacted to {name, team, frags} (the default), so
        the shape is left open here.
      required: [limit, offset, count, games]
      additionalProperties: false
      properties:
        limit:
          type: integer
          description: Page size actually applied (the request's limit clamped to 1..100).
        offset:
          type: integer
          description: Pagination offset echoed from the request.
        count:
          type: integer
          description: Rows returned in THIS page.
        total:
          type: integer
          description: >
            Total matching rows across all pages, present only when the hub
            reports it. Absent = unknown (do not assume count == total).
        games:
          type: array
          description: >
            Matching games, newest first. Each row carries id, timestamp,
            mode, matchtag, map, teams, players, demo_sha256,
            demo_source_url, server_hostname; `players` is compact
            ({name, team, frags}) unless roster=true.
          items:
            type: object
            additionalProperties: true
            properties:
              server_hostname:
                type: string
                description: >
                  The QuakeWorld server the game was played on (hub
                  passthrough, snake_case verbatim). Present in both compact
                  and roster rows.
    # --- Per-endpoint response schemas (full field-level).
    # Bootstrapped from the Go structs (result/, view/, mvd-api Overview)
    # via reflection and hand-curated; every schema is validated against
    # real golden-corpus responses by openapi_validate_test.go, so shape
    # drift fails tests. Deep field semantics: /docs/result-schema (the
    # served RESULT_SCHEMA.md; do not add repo-relative file refs in
    # rendered descriptions).
    Overview:
      additionalProperties: false
      properties:
        timeUnit: { type: string, enum: [ms], description: "Constant \"ms\" self-description echo — in the v57 pure-ms model every time value is int32 milliseconds." }
        duration:
          description: "Match duration, int32 ms."
          maximum: 2.147483647e+09
          minimum: -2.147483648e+09
          type: integer
        errors:
          description: "Non-fatal analyzer errors encountered while producing this result."
          items:
            type: string
          type:
            - "null"
            - array
        filePath:
          description: "Source demo path."
          type: string
        gameDir:
          description: "Game directory (mod)."
          type: string
        available:
          description: >
            Per-demo CAPABILITY MANIFEST (schema v70): for each detailed view, whether THIS demo
            on THIS deployment can answer it. Call /overview first and branch on this instead of
            spending a request to discover a 422.

            Each eager flag mirrors the predicate behind that view's 422, so a false here is
            exactly the 422 you would have received. A true flag means the section EXISTS, not
            that it is non-empty — a demo where nobody fired still reports shots: true with an
            empty shot list.

            height / liquid / los are the ones you CANNOT infer from anything else: they turn on
            which BSPs the server was provisioned with, not on what the demo recorded, so the
            same demo can answer differently on two deployments. There is deliberately no
            separate `pvs` flag — PVS and LOS come off one pass behind one BSP gate (PVS is a
            superset of LOS by construction), so two flags could never disagree.
          additionalProperties: false
          properties:
            demoInfo: { description: "KTX demoinfo block (non-KTX / pre-match-abort demos lack it).", type: boolean }
            metadata: { description: "Server cvars + KTX match settings (needs fullserverinfo / countdown centerprint).", type: boolean }
            frags: { description: "Obituary-derived frag log.", type: boolean }
            damage: { description: "Per-hit damage (needs the KTX mvdhidden_dmgdone stream).", type: boolean }
            shots: { description: "Weapon-fire stream.", type: boolean }
            aim: { description: "Aim analysis (needs shots + position/view streams).", type: boolean }
            locGraph: { description: "Loc adjacency graph (needs a position track).", type: boolean }
            opening: { description: "Opening analysis (needs a detected match start).", type: boolean }
            playerStats: { description: "Canonical per-player statistics (needs player streams; a missing KTX block is NOT a reason for false).", type: boolean }
            regionControl: { description: "Region-control output with at least one region. Was the top-level hasRegionControl before v70.", type: boolean }
            height: { description: "BSP-DERIVED: the floor-height column (pos.h) was COMPUTED — not that it holds a non-zero value. Depends on server-side map provisioning (the collision hull). Where there is no floor beneath a sample the column carries the NoFloor sentinel, which is still a reading.", type: boolean }
            liquid: { description: "BSP-DERIVED: the liquid column (pos.lq) was COMPUTED — not that any sample is wet. Depends on server-side map provisioning (the vis BSP), a SEPARATE gate from height. A map with no water yields a full-length all-zero column, and this flag stays TRUE: that is a measured `dry`, and is exactly what distinguishes it from an unprovisioned server, where the flag is false and the question is unanswerable.", type: boolean }
            los: { description: "BSP-DERIVED: the line-of-sight pass can run, covering BOTH the los and pvs interval sets. Unlike the others this is a PREDICTION (streams, 2+ players, a provisioned BSP) because the pass is heavy and lazy; a provisioned BSP whose visibility data will not load still 422s.", type: boolean }
          required: [demoInfo, metadata, frags, damage, shots, aim, locGraph, opening, playerStats, regionControl, height, liquid, los]
          type: object
        locCount:
          description: "Number of named locs available for the map."
          type: integer
        map:
          description: "Canonical map shortname (dm2, dm3, …) — the same value searchGames rows and /metadata serverinfo carry, so a caller can join on it. Resolved from demoinfo with a serverinfo fallback; on a degraded demo that resolves no shortname this falls back to the BSP title."
          type: string
        mapTitle:
          description: "The BSP's pretty level title (e.g. \"Claustrophobopolis\" on dm2). Omitted when identical to `map` — the common case where the map has no distinct title."
          type: string
        matchEnd:
          description: "Match end, int32 ms."
          maximum: 2.147483647e+09
          minimum: -2.147483648e+09
          type: integer
        matchStart:
          description: "Match start, int32 ms."
          maximum: 2.147483647e+09
          minimum: -2.147483648e+09
          type: integer
        matchtag:
          description: "Tournament / event tag."
          type: string
        mode:
          description: "Match mode (e.g. Duel/Team/FFA)."
          type: string
        playerUserIDs:
          description: "Player name → UserID map (Hub viewer links). Per connection SESSION, not per wire slot: for a player who reconnected this is the last session of theirs that had play — normally the id live at the end of the demo, though the ranking is by last play evidence, so an exact tie resolves to the lower slot rather than to the surviving connection (schema v66)."
          additionalProperties:
            type: integer
          type: object
        players:
          description: "Final per-player scoreboard summary."
          items:
            additionalProperties: false
            properties:
              deaths:
                description: "Deaths (all causes)."
                type: integer
              frags:
                description: "Net QW frag score."
                type: integer
              kills:
                description: "Enemy kills (from the corrected frag log)."
                type: integer
              name:
