            properties:
              byPlayer:
                description: "Per-player presence in this region, keyed by player name. Values are integer milliseconds of ALIVE, OBSERVED presence (exact time-weighted, independent of the display windowMs): dead time is excluded, sample-and-hold expires after 250 ms so unobserved holes are credited to nobody, and a player stops contributing at their end-of-track rather than holding their last region to match end (schema v64)."
                additionalProperties:
                  additionalProperties: false
                  properties:
                    armed:
                      description: "Milliseconds of alive, observed presence while carrying RL or LG."
                      type: integer
                    team:
                      description: "Team name."
                      type: string
