        **Alive dwell.** A residence is dwell, i.e. presence, so it is ALIVE
        dwell (schema v64): truncated at a death and resumed at the respawn,
        and the player's last residence ends at their end-of-track (final
        position sample held for one measured cadence, capped at 250 ms)
        rather than at match end — the same bounds `/loc-graph` node time and
        `/region-control` presence use.

        **`minDwellMs`** filters out blips shorter than the threshold by
        folding them into the preceding residence, but the fold never crosses
        a gap: dead spans (and stretches whose loc did not resolve) are never
        re-merged at any `minDwellMs`, and a residence that follows a gap is
        returned even when it is shorter than `minDwellMs`.
