  /v1/demos/{id}/state-at:
    get:
      operationId: getStateAt
      tags: [positional]
      summary: Point-in-time player state
      description: |
        Every requested field carried forward to the instant `time`
        (match-relative integer ms; REQUIRED — missing returns 400
        missing_param). The response echoes the sample instant as `time`
        (int32 ms).

        **Field selectors.** The same registry as /buckets and /stream-slice,
        except `sp`/`d` are rejected (spawns and deaths have no point-in-time
        meaning — use /events); note the `li` code renders as output key
        `loc`.

        **Two fields ride rows outside the selector:**

        - `alive` rides every row regardless of the selector
          (`true`/`false`/`null`, the stored liveness at the instant, `null` =
          not measurable).
        - `posAgeMs` rides a row whenever the request asked for at least one
          positional field (`pos`, `view`, `hgt`, `lq`, `vel`) AND a sample
          resolved: it is how old the snapped position sample is — the
          carry-forward is unbounded by design, so this is what lets a caller
          apply the 250 ms staleness rule the occupancy endpoints use.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/TimeRequired"
        - $ref: "#/components/parameters/Players"
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/Loc"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: Per-player state at the instant.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateAt" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
