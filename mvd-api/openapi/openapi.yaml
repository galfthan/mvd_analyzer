      additionalProperties: false
      properties:
        timeUnit: { type: string, enum: [ms], description: "Constant \"ms\" self-description echo — in the v57 pure-ms model every time value is int32 milliseconds." }
        pickups:
          description: "Weapon-pickup list."
          type: array
          items: { $ref: "#/components/schemas/WeaponPickup" }
    Airgibs:
      type: object
      description: >
        /airgibs body — `{timeUnit, airgibs}`; airgibs is sorted
        by height descending and [] on BSP-less maps. `time` is int32 ms
        (timeUnit is the constant `ms` echo).
      required: [timeUnit, airgibs]
      additionalProperties: false
      properties:
        timeUnit: { type: string, enum: [ms], description: "Constant \"ms\" self-description echo — in the v57 pure-ms model every time value is int32 milliseconds." }
        airgibs:
          description: "Airborne rocket-hit highlights, sorted by height descending."
          type: array
          items: { $ref: "#/components/schemas/AirgibEvent" }
    Items:
      description: >
        /items body — per-item phase timelines, or per-item take
        aggregates when summary is set.
      anyOf: # not oneOf: an empty {"items": []} matches both branches
        - $ref: "#/components/schemas/ItemsTimelines"
        - $ref: "#/components/schemas/ItemsSummary"
    Buckets:
      description: >
        /buckets body — the compact columnar grid (layout=column, the
        default) or row objects (layout=row).
      oneOf:
        - $ref: "#/components/schemas/BucketsColumnar"
        - $ref: "#/components/schemas/BucketsRow"
    Los:
      type: object
      description: >
        /los body (and the lazy `los` artifact) — per-player LOS/PVS
        interval sets. `los`/`pvs` are omitted for a player with no
        sightlines. A map with no usable visibility BSP is a 422
        `los_unavailable`, not an empty body.
      required: [timeUnit, players]
      additionalProperties: false
      properties:
        timeUnit: { type: string, enum: [ms], description: "Constant \"ms\" self-description echo — in the v57 pure-ms model every time value is int32 milliseconds." }
        players:
          description: "Per-player line-of-sight tracks."
          type: array
          items:
            type: object
            required: [name]
            additionalProperties: false
            properties:
              name: { type: string, description: "Player name." }
              los:
                description: "Line-of-sight intervals to other players."
                type: array
                items: { $ref: "#/components/schemas/LosTrack" }
              pvs:
                description: "Potentially-visible-set intervals to other players."
                type: array
                items: { $ref: "#/components/schemas/LosTrack" }
    Projectiles:
      type: object
      required: [timeUnit, projectiles]
      additionalProperties: false
      properties:
        timeUnit: { type: string, enum: [ms], description: "Constant \"ms\" self-description echo — in the v57 pure-ms model every time value is int32 milliseconds." }
        projectiles:
          description: Rocket/grenade flight stream; null when the demo has none.
          oneOf:
            - $ref: "#/components/schemas/ProjectileStreams"
            - type: "null"
    Beams:
      type: object
      required: [timeUnit, beams]
      additionalProperties: false
      properties:
        timeUnit: { type: string, enum: [ms], description: "Constant \"ms\" self-description echo — in the v57 pure-ms model every time value is int32 milliseconds." }
        beams:
          description: LG bolt stream; null when the demo has none.
          oneOf:
            - $ref: "#/components/schemas/BeamStreams"
            - type: "null"
    Nails:
      type: object
      required: [timeUnit, nails]
      additionalProperties: false
      properties:
        timeUnit: { type: string, enum: [ms], description: "Constant \"ms\" self-description echo — in the v57 pure-ms model every time value is int32 milliseconds." }
        nails:
          description: Nail flight stream; null when the demo has none.
          oneOf:
            - $ref: "#/components/schemas/ProjectileStreams"
            - type: "null"
    LocTable:
      type: object
      required: [locTable]
      additionalProperties: false
      properties:
        locTable:
          type: array
          description: Interned loc names; index 0 is the "" no-loc sentinel.
          items: { type: string }
    Graph:
      type: object
      description: The analyzer DAG — analyzer.ExportGraph("json").
      required: [nodes, edges]
      additionalProperties: false
      properties:
        nodes:
          description: "Analyzer DAG nodes."
          type: [array, "null"]
          items:
            type: object
            required: [name, requires, provides, mutates, lazy, depth, cost, resultKey]
            additionalProperties: false
            properties:
              name: { type: string, description: "Name / display label." }
              requires:
                description: "Upstream nodes this node depends on."
                type: [array, "null"]
                items: { type: string }
              provides:
                description: "Result sections this node provides."
                type: [array, "null"]
                items: { type: string }
              mutates: { type: boolean, description: "Result sections this node mutates." }
              lazy: { type: boolean, description: "Materialised on demand (not in the base parse)." }
              depth: { type: integer, description: "DAG depth." }
              cost:
                description: "Materialisation cost class."
                type: string
                enum: [light, heavy]
              resultKey: { type: string, description: "Result JSON key this artifact serves under." }
        edges:
          description: "Directed loc-transition edges."
          type: [array, "null"]
          items:
            type: object
            required: [from, to, artifact]
            additionalProperties: false
            properties:
              from: { type: string, description: "Edge source." }
              to: { type: string, description: "Edge target." }
              artifact: { type: string, description: "Artifact name this edge carries." }
    ArtifactEnvelope:
      description: >
        GET /v1/demos/{id}/artifacts/{name} body — a single-key envelope
        keyed by the artifact's resultKey (see GET /v1/artifacts; the key
        is NOT the node name — e.g. node `frag` serves `{"frags": …}`).
        Raw list/object sections (match, messages, timeline, items,
        map-entities, backpacks, weapon-pickups) may be null at 200 for
        demos without the signal; capability-gated artifacts return their
        422 code instead. The lazy `los` artifact serves the /los body
        shape (no resultKey).
      oneOf:
        - type: object
          required: [demoInfo]
          additionalProperties: false
          properties:
            demoInfo: { $ref: "#/components/schemas/DemoInfo" }
        - type: object
          required: [frags, timeUnit]
          additionalProperties: false
          properties:
            frags: { $ref: "#/components/schemas/Frags" }
            timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        - type: object
          required: [metadata]
          additionalProperties: false
          properties:
            metadata: { $ref: "#/components/schemas/Metadata" }
        - type: object
          required: [damage, timeUnit]
          additionalProperties: false
          properties:
            damage: { $ref: "#/components/schemas/Damage" }
            timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        - type: object
          required: [shots, timeUnit]
          additionalProperties: false
          properties:
            shots: { $ref: "#/components/schemas/Shots" }
            timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        - type: object
          required: [aim, timeUnit]
          additionalProperties: false
          properties:
            aim: { $ref: "#/components/schemas/Aim" }
            timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        - type: object
          required: [locGraph, timeUnit]
          additionalProperties: false
          properties:
            locGraph: { $ref: "#/components/schemas/LocGraph" }
            timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        - type: object
          required: [opening, timeUnit]
          additionalProperties: false
          properties:
            opening: { $ref: "#/components/schemas/Opening" }
            timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        - type: object
          required: [match, timeUnit]
          additionalProperties: false
          properties:
            match:
              description: Match summary section (null on demos without it).
              oneOf:
                - $ref: "#/components/schemas/Match"
                - type: "null"
            timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        - type: object
          required: [messages, timeUnit]
          additionalProperties: false
          properties:
            messages:
              description: Match message log section (null on demos without it).
              oneOf:
                - $ref: "#/components/schemas/Messages"
                - type: "null"
            timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        - type: object
          required: [timelineAnalysis, timeUnit]
          additionalProperties: false
          properties:
            timelineAnalysis:
              description: Event-shaped derived timeline section (null on demos without it).
              oneOf:
                - $ref: "#/components/schemas/TimelineAnalysis"
                - type: "null"
            timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        - type: object
          required: [items, timeUnit]
          additionalProperties: false
          properties:
            items:
              description: Per-item pickup-timeline section (null on demos without it).
              oneOf:
                - $ref: "#/components/schemas/ItemsTimelines"
                - type: "null"
            timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        - type: object
          required: [mapEntities]
          additionalProperties: false
          properties:
            mapEntities:
              description: Static map-entity layout section (null when no corpus exists for the map).
              oneOf:
                - $ref: "#/components/schemas/MapEntities"
                - type: "null"
        - type: object
          required: [backpacks, timeUnit]
          additionalProperties: false
          properties:
            backpacks:
              description: Dropped RL/LG backpack list (null on demos without it).
              type: [array, "null"]
              items: { $ref: "#/components/schemas/BackpackDrop" }
            timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        - type: object
          required: [weaponPickups, timeUnit]
          additionalProperties: false
          properties:
            weaponPickups:
              description: Slot-weapon pickup list (null on demos without it).
              type: [array, "null"]
              items: { $ref: "#/components/schemas/WeaponPickup" }
            timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        - type: object
          required: [playerStats, timeUnit]
          additionalProperties: false
          properties:
            playerStats:
              description: >
                Canonical per-player statistics section. Never null, unlike most sibling artifact
                envelopes: a parse degraded enough to produce no player streams 422s with
                `playerstats_unavailable` instead. A missing KTX demoinfo block is NOT that case —
                the section is computed for every demo.
              $ref: "#/components/schemas/PlayerStats"
            timeUnit: { $ref: "#/components/schemas/TimeUnit" }
        - $ref: "#/components/schemas/Los"
