    RegionControl:
      additionalProperties: false
      properties:
        timeUnit: { type: string, enum: [ms], description: "Constant \"ms\" self-description echo — in the v57 pure-ms model every time value is int32 milliseconds." }
        bucketStates:
          description: "Per-bucket per-region control codes (one ASCII char each) at the requested windowMs. Each bucket is a point-sample classification: the state of every player's last position at bucket-start. It shares the exact walk's classification point and therefore its liveness and staleness bounds (schema v64) — a dead player, a player whose last sample is more than 250 ms old, and a player past their end-of-track all contribute nothing, so a bucket with no qualifying player reads '_' (empty)."
          additionalProperties:
