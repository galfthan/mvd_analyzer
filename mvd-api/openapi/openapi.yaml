  /v1/demos/{id}/region-control:
    get:
      operationId: getRegionControl
      tags: [timeline]
      summary: Region-control timeline
      description: |
        Team control of named map regions over time.

        **`windowMs` is display-only.** It (⚠️ defaults to 50 ms — pass an
        explicit window) sets only the `bucketStates` display resolution; the
        aggregate `stats` (percentages + `byPlayer`) are the exact
        time-weighted integral over the native position samples (no grid),
        independent of `windowMs`, so they don't change with the display
        window.

        **Presence is alive + observed.** `byPlayer.armed`/`unarmed` are
        integer milliseconds of ALIVE, OBSERVED presence (schema v64): dead
        players are excluded, a sample's evidence expires after 250 ms so
        unobserved holes are credited to nobody, and a player stops
        contributing at their end-of-track (final position sample held for one
        measured cadence, capped at 250 ms) rather than holding their last
        region to match end. `bucketStates` shares the same classification
        point, so a bucket in which no player qualifies reads `_`.

        **Payload trimming.** The `regions` param trims the polygon payload:
        `full` (default) ships the region `points`; `summary` strips them;
        `none` omits the `regions` list entirely — `bucketStates` and `stats`
        are unaffected.

        **Errors.** 422 `region_control_unavailable` when the map has no
        region layout.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/WindowMs"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
