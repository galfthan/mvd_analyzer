                    description: "Real wall-clock ms the pause lasted."
                    maximum: 2.147483647e+09
                    minimum: -2.147483648e+09
                    type: integer
                required:
                  - atMs
                  - durationMs
                type: object
              type:
                - "null"
                - array
          type:
            - "null"
            - object
        topPowerups:
          description: "Top powerup runs (Key Moments)."
          items:
            additionalProperties: false
            properties:
              duration:
                description: "Match duration, int32 ms."
                maximum: 2.147483647e+09
                minimum: -2.147483648e+09
