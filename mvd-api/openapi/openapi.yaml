      description: >
        Column-major buckets (layout=column, the default). The time axis is
        implicit: time(i) = start + i*windowMs (int32 ms). Each player
        object inlines its dense columns at the top level keyed by field
        code; boolean columns (and the alive mask) serialize as 0/1.
      required: [timeUnit, windowMs, start, count]
      additionalProperties: false
      properties:
        timeUnit: { type: string, enum: [ms], description: "Constant \"ms\" self-description echo — in the v57 pure-ms model every time value is int32 milliseconds." }
        windowMs: { type: integer, description: "Bucket width, int32 ms." }
        start: { type: integer, description: First bucket start, int32 ms. }
        count: { type: integer, description: "Number of buckets." }
        partialLastMs:
          type: integer
          description: Shorter end of the final bucket when the match length is not a multiple of windowMs.
        locTable:
          type: array
          description: >
            Legend for the raw li columns — the demo's interned loc-name
            table (index 0 is the "" no-loc sentinel; identical to
            /loc-table). Present iff an li column is in the output, so
            columnar responses decode locally without a /loc-table call
            (v53).
          items: { type: string }
        players:
          description: "Per-player columnar bucket series, keyed by player name."
          type: object
          additionalProperties:
            type: object
            description: >
              One player's dense columns over their active span
              [first, first+n). Reserved keys first/n/alive/validFrom;
              every other key is a requested field-code column (or a
              position/view sub-column like x/y/z, vp/vya, vx/vy/vz) of
              length n — numeric, string (at), or 0/1 series.
