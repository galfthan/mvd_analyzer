  /v1/demos/{id}/region-control:
    get:
      operationId: getRegionControl
      tags: [timeline]
      summary: Region-control timeline
      description: >
        Team control of named map regions over time. `windowMs` (⚠️
        defaults to 50 ms — pass an explicit window) sets only the
        `bucketStates` display resolution; the aggregate `stats`
        (percentages + `byPlayer`) are the exact time-weighted integral
        over the native position samples (no grid), independent of
        `windowMs`, so they don't change with the display window.
        `byPlayer.armed`/`unarmed` are integer milliseconds of presence.
        The `regions` param trims the polygon payload: `full` (default)
        ships the region `points`; `summary` strips them; `none` omits the
        `regions` list entirely — `bucketStates` and `stats` are unaffected.
        422 `region_control_unavailable` when the map has no region
        layout.
