  /v1/demos/{id}/loc-graph:
    get:
      operationId: getLocGraph
      tags: [positional]
      summary: Per-map loc adjacency graph
      description: |
        Which locs are reachable from which, weighted by observed traversal.
        Node weights (ALIVE, OBSERVED time spent; dead players excluded since
        schema v64) are int32 ms; edge weights are transition counts.

        Two bounds shape both:

        - a position sample's evidence expires after 250 ms, so time inside an
          unobserved hole (a PVS gap on a POV recording, packet loss) is
          credited to nobody and no edge is recorded across such a hole;
        - a player stops contributing at their end-of-track (final sample held
          for one measured cadence, capped at 250 ms) rather than holding
          their last loc to match end.

        Both are inert on server-recorded demos, where gaps are cadence-sized.

        Echoes `timeUnit:"ms"`. 422 `locgraph_unavailable` when no position
        track was emitted.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The loc graph.
          headers: *perDemoHeaders
