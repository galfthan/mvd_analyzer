        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/artifacts/{name}:
    get:
      operationId: getArtifact
      tags: [artifacts]
      summary: Generic artifact accessor
      description: |
        Materialise and serve any servable artifact by DAG node name. The
        response is a single-key envelope — the key is the artifact's
        **resultKey, NOT the node name**. Accepts NO query parameters
        (parameterised reads are the curated endpoints) — any parameter
        returns 400 invalid_param. Unknown / non-servable names 404
        artifact_unknown. Capability-gated artifacts return their
        section-specific 422 code. ETag is the finer per-artifact form
        `"<sha>-<name>@v<n>"`.

        | DAG node | curated route | body key (resultKey) | when the demo lacks it |
        |---|---|---|---|
        | demoinfo | /demoinfo | demoInfo | 422 demoinfo_unavailable |
        | frag | /frags | frags | 422 frags_unavailable |
        | metadata | /metadata | metadata | 422 metadata_unavailable |
        | match | — (feeds /overview) | match | 200, null body value |
        | messages | /chat (filtered view) | messages | 200, null body value |
        | timeline | — (feeds /events, /buckets, /region-control) | timelineAnalysis | 200, null body value |
        | items | /items (filtered view) | items | 200, null body value |
        | damage | /damage | damage | 422 damage_unavailable |
        | shots | /shots | shots | 422 shots_unavailable |
        | map-entities | /v1/maps/{map}/entities (per-map form) | mapEntities | 200, null body value |
        | backpacks | /backpacks (filtered view) | backpacks | 200, null/[] |
        | weapon-pickups | /weapon-pickups (filtered view) | weaponPickups | 200, null/[] |
        | aim | /aim | aim | 422 aim_unavailable |
        | loc-graph | /loc-graph | locGraph | 422 locgraph_unavailable |
        | opening | — (artifact only) | opening | 422 opening_unavailable |
        | los | /los | — (serves the /los body, no envelope key) | 422 los_unavailable (map has no usable visibility BSP) |
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/ArtifactName"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: Single-key artifact envelope.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactEnvelope" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Unknown demo (`demo_not_found`) or unknown/non-servable artifact name (`artifact_unknown`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/games/search:
    get:
      operationId: searchGames
      tags: [demo]
      summary: Search the hub game catalog
      description: >
        Discovery over hub.quakeworld.nu's public game catalog — no demo is
        involved. Filter by player names, teams, map, mode, matchtag, or
        date range; the newest matches come back when no filter is given.
        Feed a result's `gameId:<id>` to any per-demo endpoint to analyse
        it. `count` is rows in THIS page, `total` (when the hub reports it)
        is all matching rows — page with limit/offset until offset+count >=
        total. Rows are compact by default (each player projected to
        {name, team, frags}); `roster=true` returns the verbatim hub rows
        (per-player ping, colors, is_bot). This endpoint proxies a live
        upstream, so it is not cached and can 502 `hub_upstream`.
      parameters:
        - $ref: "#/components/parameters/SearchPlayers"
        - $ref: "#/components/parameters/SearchTeams"
        - $ref: "#/components/parameters/SearchMap"
        - $ref: "#/components/parameters/SearchMode"
        - $ref: "#/components/parameters/SearchMatchtag"
        - $ref: "#/components/parameters/SearchFrom"
        - $ref: "#/components/parameters/SearchTo"
        - $ref: "#/components/parameters/SearchLimit"
        - $ref: "#/components/parameters/SearchOffset"
        - $ref: "#/components/parameters/SearchRoster"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The matching page of games.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GamesSearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/HubUpstream" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/maps/{map}/entities:
    get:
      operationId: getMapEntitiesByMap
      tags: [maps]
      summary: Static map entity layout
      description: >
        Items, spawns, teleporters, buttons, doors for a map from the
        embedded corpus — no demo needed, identical for every demo on the
        map (a caller holding a demo id reads the map name from /overview
        first; the per-match pickup timeline is /items). ETag
        `"ents-<map>-v<corpusVersion>"`.
      parameters:
        - $ref: "#/components/parameters/MapName"
        - $ref: "#/components/parameters/EntityTypes"
        - $ref: "#/components/parameters/Kinds"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The entity list.
          headers: &mapStaticHeaders
            ETag: { $ref: "#/components/headers/ETag" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapEntities" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/MapUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/maps/{map}/geometry:
    get:
      operationId: getMapGeometry
      tags: [maps]
      summary: Per-map floor-polygon geometry
      description: >
        Streams the per-map floor-polygon geometry JSON (large; REST-only,
        no MCP tool). 404 `map_unavailable` when geometry is not
        provisioned on this server or unknown for the map. ETag
        `"geo-<map>-<size>"`.
      parameters:
        - $ref: "#/components/parameters/MapName"
        - $ref: "#/components/parameters/Label"
      responses:
        "200":
          description: The geometry document.
          headers: *mapStaticHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapGeometry" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/MapUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
components:
  securitySchemes:
    bearerKey:
      type: http
      scheme: bearer
      description: >
        API key as `Authorization: Bearer <key>`. Required only when the
        server runs in auth mode (the hosted deployment); localhost /
        no-auth mode accepts every request and treats the header as an
        unvalidated source label for the access log. Exempt even in auth
        mode: /healthz, /v1/version, /openapi.yaml, /docs.
  parameters:
    Label:
      name: label
      in: query
      required: false
      description: >
        Non-secret traffic-source tag for access-log attribution. Accepted on
        every endpoint; never affects the response.
      schema: { type: string }
    DemoId:
      name: id
      in: path
      required: true
      description: >
        Demo identity: `gameId:N` (a hub.quakeworld.nu game id, positive
        integer) or `sha:HEX` (lowercase-insensitive 64-hex SHA-256 of the
        demo file). Every per-demo endpoint auto-resolves and auto-loads
        on cache miss.
      schema:
        type: string
        pattern: "^(gameId:[0-9]+|sha:[0-9a-fA-F]{64})$"
      examples:
        byGameId: { value: "gameId:145060" }
        bySha: { value: "sha:ffda58010f3ab43c020dfd267dd90ba6775ec8e6f0b969ade82ca15d9162f57d" }
    ArtifactName:
      name: name
      in: path
      required: true
      description: >
        DAG node name of a servable artifact (see GET /v1/artifacts).
        Note the body key of the response is the artifact's `resultKey`,
        which may differ from this name.
      schema:
        type: string
        enum:
          # artifact-enum:begin — pinned to analyzer.ArtifactManifest() (servable only) by TestOpenAPIArtifactEnumCurrent
          - demoinfo
          - frag
          - metadata
          - match
          - messages
          - timeline
          - items
          - damage
          - shots
          - map-entities
          - backpacks
          - weapon-pickups
          - aim
          - loc-graph
          - opening
          - los
          # artifact-enum:end
    MapName:
      name: map
      in: path
      required: true
      description: Map name, e.g. `dm3` (normalized server-side).
      schema: { type: string }
    From:
      name: from
      in: query
      description: >
        Window start, match-relative integer MILLISECONDS. 0 / omitted = no
        lower bound. Endpoints treat the window as inclusive on both ends.
        A non-integer value 400s with code `invalid_param` and an `(integer
        milliseconds)` hint.
      schema: { type: integer, minimum: 0 }
    To:
      name: to
      in: query
      description: >
        Window end, match-relative integer MILLISECONDS. 0 / omitted = no
        upper bound. A non-integer value 400s with code `invalid_param` and
        an `(integer milliseconds)` hint.
      schema: { type: integer, minimum: 0 }
    Players:
      name: players
      in: query
      description: >
        CSV of player display names. Case-SENSITIVE (QW names are
        case-significant). Omit for all players. Filter semantics are
        per-endpoint (e.g. killer-or-victim on /frags, speaker on /chat).
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    Weapons:
      name: weapons
      in: query
      description: >
        CSV of weapon codes (case-insensitive). Core codes: rl, lg, gl, ssg,
        sng, ng, sg, axe; on /damage the pseudo-codes tele/stomp select
        the positional instant kills (which carry no real weapon). Each
        endpoint validates against its OWN closed vocabulary and returns 400
        `invalid_param` (listing the valid set) for an unknown token — no more
        silent empty result. /frags additionally accepts the obituary
        environmental / cause codes (hook, rail, squish, fall, lava, slime,
        water, world, tele, stomp, unknown, suicide, teamkill); /damage the
        death-type + environmental codes (explobox, squish, lava, slime, drown,
        fall, trigger, suicide, unknown); /backpacks accepts rl/lg only;
        /weapon-pickups ssg,ng,sng,gl,rl,lg. The pre-16.2 singular spelling
        `weapon` is an accepted legacy alias; `weapons` wins when both are
        present.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    WeaponsLegacy:
      name: weapon
      in: query
      deprecated: true
      description: >
        Deprecated legacy alias of `weapons` (the pre-16.2 singular
        spelling). Ignored when `weapons` is present.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    ShotsNails:
      name: nails
      in: query
      deprecated: true
      description: >
        Deprecated no-op. The retired opt-in that once gated ng/sng nail
        linking; ng/sng fires are always in the stream now. Accepted and
        ignored so old callers do not 400.
      schema: { type: string }
    Summary:
      name: summary
      in: query
      description: >
        `1`/`true` drops the big per-event log / sample arrays / phase
        timeline and returns only the aggregates.
      schema: { type: boolean }
    ItemsFilter:
      name: items
      in: query
      description: >
        CSV restricting to items whose Name or Kind matches
        (case-insensitive). A kind token matches every instance ("ya" →
        ya_1, ya_2); an instance name ("ya_1") matches one.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    Kinds:
      name: kinds
      in: query
      description: >
        CSV of item categories — armor, mega, health, powerup, weapon,
        ammo — or raw kind tokens (ra, quad). Case-insensitive.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    Source:
      name: source
      in: query
      description: Restrict weapon pickups by provenance.
      schema:
        type: string
        enum: [world, backpack, unknown]
    ChatTypes:
      name: types
      in: query
      description: >
        CSV of message types; defaults to `chat,teamsay`. Pass a subset to
        narrow. An unknown value 400s (invalid_param).
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - chat
            - teamsay
    EventTypes:
      name: types
      in: query
      description: >
        CSV of event types: frag, powerup, streak, spawn, death, weapon,
        item, chat, pickup (the default set), plus the opt-in
        high-frequency / dedicated lenses damage, health, armor, loc,
        telefrag, stomp. Omit for the default set. An unknown type value
        400s (invalid_param) rather than silently matching nothing.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            # event-type-enum:begin — pinned to view.KnownEventTypes by TestOpenAPIEventTypesCurrent
            - frag
            - powerup
            - streak
            - spawn
            - death
            - weapon
            - item
            - chat
            - pickup
            - demomark
            - airgib
            - pause
            - damage
            - telefrag
            - stomp
            - health
            - armor
            - loc
            # event-type-enum:end
    EntityTypes:
      name: types
      in: query
      description: >
        CSV of entity types: item, spawn, teleportDst, teleportSrc,
        button, door.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    Fields:
      name: fields
      in: query
      description: >
        CSV of field selector codes. Omit for the default set (everything
        except the opt-in view/hgt/lq/vel). NOTE: the selector code `li`
        renders as output key `loc` in name mode — `loc` is NOT a selector
        code. Unknown codes 400 with the full vocabulary enumerated.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            # field-code-enum:begin — pinned to view/fields.go by TestOpenAPIFieldCodesCurrent
            - h
            - a
            - at
            - li
            - pos
            - view
            - hgt
            - lq
            - vel
            - rl
            - lg
            - gl
            - ssg
            - sng
            - q
            - pe
            - r
            - sh
            - nl
            - rk
            - cl
            - sp
            - d
            # field-code-enum:end
    Loc:
      name: loc
      in: query
      description: >
        Loc rendering — `name` (default) resolves loc indices to names;
        `index` returns raw LocTable indices (decode via /loc-table).
      schema:
        type: string
        enum: [name, index]
    Layout:
      name: layout
      in: query
      description: >
        /buckets response layout — `column` (default, compact columnar
        grid) or `row` (row objects).
      schema:
        type: string
        enum: [column, row]
    RegionsMode:
      name: regions
      in: query
      description: >
        Region-list detail on /region-control. `full` (default,
        backward-compatible) — the whole ControlRegion list including each
        region's polygon `points` (~6 KB, needed only to draw the map
        overlay). `summary` — regions with `points` stripped (`name`, `locs`,
        `centroidX`/`centroidY` kept), for stats-only consumers. `none` — the
        `regions` list is omitted from the response entirely. `bucketStates`
        and `stats` are identical across all three.
      schema:
        type: string
        enum: [full, summary, none]
    Dmg:
      name: dmg
      in: query
      description: >
        Damage family (schema v55). `raw` — the unbound wire values in the
        v53 field layout, with v54 fold semantics (given/taken include the
        telefrag/stomp folds on standard demos; the kill entries keep their
        fold fields and boundedMode survives). `bounded` — KTX-scoreboard semantics (armor
        absorbed + health capped to remaining) materialized into the same
        field names; an EXPLICIT `dmg=bounded` is a 422 `bounded_unavailable`
        on midair / instagib / dmgfrags demos, whose server mode makes the
        reconstruction impossible. `both` —
        the raw fields plus per-player `bounded` nests and a per-event
        `bounded`. Default (unset): `bounded`, for both `summary=true` and the
        full log — a defaulted bounded on a skipped:* demo falls back to `raw`
        rather than 422.
      schema:
        type: string
        enum: [raw, bounded, both]
    Reducers:
      name: reducers
      in: query
      description: >
        CSV of `field=reducerName` pairs overriding the per-field default
        reducer, e.g. `reducers=h=min,a=last`. Registry: first (default
        for most fields — value at window start), last, mean, min, max,
        dominant (most common value), held-any, majority, any. Unknown
        names 400.
      schema: { type: string }
    IncludeTeam:
      name: includeTeam
      in: query
      description: Include each player's team in the bucket envelope.
      schema: { type: boolean }
    WindowMs:
      name: windowMs
      in: query
      description: >
        Window size, integer MILLISECONDS. ⚠️ Defaults to 50 ms — on a
        20-minute match that is ~24,000 windows per field per player.
        Always pass a windowMs sized to your question. All time params are
        ms: windowMs, from, and to alike. Omit it for the default; an
        explicit windowMs=0 is rejected with 400 invalid_param.
      schema:
        type: integer
        default: 50
        minimum: 1
    MinDwellMs:
      name: minDwellMs
      in: query
      description: Drop loc residences shorter than this many milliseconds.
      schema:
        type: integer
        minimum: 0
    TimeRequired:
      name: time
      in: query
      required: true
      description: >
        The instant to sample, match-relative integer MILLISECONDS. A
        non-integer value 400s with code `invalid_param` and an `(integer
        milliseconds)` hint.
      schema: { type: integer, minimum: 0 }
    SearchPlayers:
      name: players
      in: query
      description: >
        CSV of player names to match (full-text search on the roster,
        AND'd across multiple names). Case-INsensitive: the hub matches via
        PostgREST full-text search, which lowercases both the query and the
        indexed names (`to_tsvector`), so `bps` and `BPS` match the same
        games. This differs from the per-demo endpoints' `players` filter,
        which is an exact, case-sensitive name match.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    SearchTeams:
      name: teams
      in: query
      description: >
        CSV of team names that must all appear in the game's team list
        (contains).
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    SearchMap:
      name: map
      in: query
      description: Map name, exact match (e.g. `dm6`).
      schema: { type: string }
    SearchMode:
      name: mode
      in: query
      description: Game mode, exact match (e.g. `1on1`, `2on2`, `4on4`, `FFA`).
      schema: { type: string }
    SearchMatchtag:
      name: matchtag
      in: query
      description: >
        Tournament / event tag, case-insensitive substring (e.g. `qwsl`).
        Documented casing exception: the param name is the lowercase single
        word `matchtag` (mirroring the KTX serverinfo key), not camelCase like
        the other multi-word query params.
      schema: { type: string }
    SearchFrom:
      name: from
      in: query
      description: >
        Calendar date lower bound, inclusive. Strict `YYYY-MM-DD` (exactly
        10 characters, a real date); a malformed value is rejected with
        `400 invalid_param` at the API boundary (it no longer reaches the
        hub as a `502 hub_upstream`). NOTE these are calendar dates that
        select which games to list — unrelated to the per-demo endpoints'
        `from`/`to`, which are match-relative times bounding a window
        within one demo.
      schema: { type: string }
    SearchTo:
      name: to
      in: query
      description: >
        Calendar date upper bound, inclusive (the whole end day is
        included). Strict `YYYY-MM-DD` (exactly 10 characters, a real
        date); a malformed value is rejected with `400 invalid_param` at
        the API boundary (it no longer reaches the hub as a `502
        hub_upstream`). NOTE these are calendar dates that select which
        games to list — unrelated to the per-demo endpoints' `from`/`to`,
        which are match-relative times bounding a window within one demo.
      schema: { type: string }
    SearchLimit:
      name: limit
      in: query
      description: >
        Max rows per page. Omit for the default 20. An explicit `limit=0`
        is distinguishable from an absent one and is rejected with `400
        invalid_param` (omit the param for the default instead); a value
        above 100 or a negative value is likewise rejected — no longer
        silently clamped.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    SearchOffset:
      name: offset
      in: query
      description: >
        Pagination offset (number of rows to skip). A negative value is
        rejected with `400 invalid_param`.
      schema:
        type: integer
        minimum: 0
    SearchRoster:
      name: roster
      in: query
      description: >
        `1`/`true` returns the verbatim hub rows (per-player ping, color
        arrays, name_color, is_bot); default returns compact rows with each
        player projected to {name, team, frags}.
      schema: { type: boolean }
  headers:
    ETag:
      description: >
        Strong validator. Per-demo `"<sha>-v<schemaVersion>"`; per-artifact
        `"<sha>-<name>@v<n>"`; binary-static `"<kind>-v<n>"`; map-static
        `"ents-<map>-v<n>"` / `"geo-<map>-<size>"`; spec/docs content hash.
      schema: { type: string }
    XCache:
      description: Which cache tier served the demo — HIT, WARM, or MISS.
      schema:
        type: string
        enum: [HIT, WARM, MISS]
    XSchemaVersion:
      description: result.CurrentSchemaVersion of the serving binary.
      schema: { type: string }
    XRequestId:
      description: >
        Per-request id echoed in the server access log; quote it when
        reporting a problem.
      schema: { type: string }
  responses:
    NotModified:
      description: >
        Not Modified — the If-None-Match validator matched; the cached
        representation is current.
    BadRequest:
      description: >
        Malformed `{id}` (`invalid_demo_id`), malformed or rejected query
        parameter (`invalid_param`), or required parameter absent
        (`missing_param`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: >
        Auth mode only — missing / invalid / revoked API key
        (`unauthorized`). Carries `WWW-Authenticate: Bearer`. The body is
        deliberately generic.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    DemoNotFound:
      description: The hub has no row for this gameId (`demo_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    MapUnavailable:
      description: >
        No entity corpus / geometry for this map (`map_unavailable`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unavailable:
      description: >
        The demo structurally lacks the signal this section needs
        (`<section>_unavailable` — the operation description names the
        specific code). Expected for some demos; treat as "panel
        unavailable", not failure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: >
        Auth mode only — per-key rate limit exceeded (`rate_limited`).
        Carries `Retry-After` (seconds); wait and retry.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    HubUpstream:
      description: Network error / 5xx from the hub (`hub_upstream`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Internal:
      description: >
        Unexpected server error (`internal`). The body is generic — a
        fixed message plus the request id; the real error is logged
        server-side keyed by X-Request-Id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    ErrorEnvelope:
      type: object
      description: Stable error envelope for every non-2xx JSON response.
      required: [error]
      additionalProperties: false
      properties:
        error:
          description: "Error object (code + message)."
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: >
                Human-readable and user-actionable for 4xx; generic (request
                id only) for 5xx.
    ErrorCode:
      type: string
      description: Machine-readable error class.
      enum:
        # error-code-enum:begin — pinned to the writeError/writeUnavailable call sites by TestOpenAPIErrorCodesCurrent
        - aim_unavailable
        - airgibs_unavailable
        - artifact_unknown
        - bounded_unavailable
        - damage_unavailable
        - demo_not_found
        - demo_too_large
        - demoinfo_unavailable
        - frags_unavailable
        - hub_upstream
        - internal
        - invalid_demo_id
        - invalid_gzip
        - invalid_param
        - locgraph_unavailable
        - los_unavailable
        - map_unavailable
        - metadata_unavailable
        - missing_param
        - opening_unavailable
        - rate_limited
        - region_control_unavailable
        - shots_unavailable
        - unauthorized
        - unknown_param
        - unparseable_demo
        - upload_quota_exceeded
        - uploads_disabled
        # error-code-enum:end
    TimeUnit:
      type: string
      description: >
        The unit of a governed response's time values (schema v57): always
        `ms` (int32 milliseconds). In the pure-ms model there is only one
        unit, so this echo is a constant `"ms"` self-description present so
        the body is self-describing. This shared component is referenced by
        the schemas reused across the raw /artifacts envelope
        (Frags/Damage/Shots/ItemsTimelines); the value is invariant.
      enum: [ms]
    Health:
      type: object
      required: [ok, schemaVersion]
      additionalProperties: false
      properties:
        ok: { type: boolean, description: "Service healthy." }
        schemaVersion: { type: integer, description: "Result schema version this response was produced under." }
    Version:
      type: object
      required: [hash, tag, buildDate]
      additionalProperties: false
      properties:
        hash: { type: string, description: Git commit hash of the build. }
        tag: { type: string, description: Git tag, if any. }
        buildDate: { type: string, description: "Build date." }
    LoadResult:
      type: object
      required: [demoId, sha256, fromCache, schemaVersion]
      additionalProperties: false
      properties:
        demoId:
          type: string
          description: Canonical `sha:HEX` id — use it for subsequent calls.
        sha256: { type: string, description: "Demo SHA-256." }
        fromCache: { type: boolean, description: "The result was served from cache." }
        schemaVersion: { type: integer, description: "Result schema version this response was produced under." }
    ArtifactsManifest:
      type: object
      required: [schemaVersion, artifacts]
      additionalProperties: false
      properties:
        schemaVersion: { type: integer, description: "Result schema version this response was produced under." }
        artifacts:
          description: "DAG node manifest entries."
          type: array
          items: { $ref: "#/components/schemas/ArtifactMeta" }
    ArtifactMeta:
      type: object
      description: One analyzer DAG node, as listed in ARTIFACTS.md.
      required: [name, mutates, lazy, cost, servable]
      additionalProperties: false
      properties:
        name: { type: string, description: DAG node name. }
        requires:
          description: "Upstream nodes this node depends on."
          type: [array, "null"]
          items: { type: string }
        provides:
          description: "Result sections this node provides."
          type: [array, "null"]
          items: { type: string }
        mutates: { type: boolean, description: "Result sections this node mutates." }
        lazy: { type: boolean, description: "Materialised on demand (not in the base parse)." }
        cost:
          description: "Materialisation cost class."
          type: string
          enum: [light, heavy]
        resultKey:
          type: string
          description: >
            Top-level Result JSON key (the generic artifact endpoint's body
            key). Empty = internal / no direct section.
        servable: { type: boolean, description: "Exposed via GET /v1/demos/{id}/artifacts/{name}." }
        description: { type: string, description: "Human-readable description." }
    GamesSearchResult:
      type: object
      description: >
        One page of hub game-catalog matches (GET /v1/games/search). The
        game rows are passed through from the hub verbatim (roster=true) or
        with each player compacted to {name, team, frags} (the default), so
        the shape is left open here.
      required: [limit, offset, count, games]
      additionalProperties: false
      properties:
        limit:
          type: integer
          description: Page size actually applied (the request's limit clamped to 1..100).
        offset:
          type: integer
          description: Pagination offset echoed from the request.
        count:
          type: integer
          description: Rows returned in THIS page.
        total:
          type: integer
          description: >
            Total matching rows across all pages, present only when the hub
            reports it. Absent = unknown (do not assume count == total).
        games:
          type: array
          description: >
            Matching games, newest first. Each row carries id, timestamp,
            mode, matchtag, map, teams, players, demo_sha256,
            demo_source_url, server_hostname; `players` is compact
            ({name, team, frags}) unless roster=true.
          items:
            type: object
            additionalProperties: true
            properties:
              server_hostname:
                type: string
                description: >
                  The QuakeWorld server the game was played on (hub
                  passthrough, snake_case verbatim). Present in both compact
                  and roster rows.
    # --- Per-endpoint response schemas (full field-level).
    # Bootstrapped from the Go structs (result/, view/, mvd-api Overview)
    # via reflection and hand-curated; every schema is validated against
    # real golden-corpus responses by openapi_validate_test.go, so shape
    # drift fails tests. Deep field semantics: /docs/result-schema (the
    # served RESULT_SCHEMA.md; do not add repo-relative file refs in
    # rendered descriptions).
    Overview:
      additionalProperties: false
      properties:
        timeUnit: { type: string, enum: [ms], description: "Constant \"ms\" self-description echo — in the v57 pure-ms model every time value is int32 milliseconds." }
