                description: "Quad active at the instant."
                type:
                  - "null"
                  - boolean
              r:
                description: "Ring (invisibility) active at the instant."
                type:
                  - "null"
                  - boolean
              rk:
                description: "Rockets ammo at the instant."
                maximum: 32767
