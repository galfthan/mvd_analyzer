<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Stamped with the git hash by `make build` (sed); "dev" in a local
         Vite build. app.js compares it against the wasm's embedded
         hash to detect a stale cached bundle after a deploy. -->
    <meta name="build" content="dev">
    <title>MVD Analyzer</title>
    <!-- Rajdhani + Inter, vendored from Google Fonts (see vendor/README.md). -->
    <link rel="stylesheet" href="vendor/fonts/fonts.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Cytoscape.js for the Loc Graph tab, vendored (no runtime CDN). Load
         order matters: cytoscape first, then the fcose dependency chain
         (layout-base -> cose-base -> cytoscape-fcose, each reads the
         previous one's window global). See vendor/README.md. -->
    <script src="vendor/cytoscape-3.30.2.min.js"></script>
    <script src="vendor/layout-base-2.0.1.js"></script>
    <script src="vendor/cose-base-2.2.0.js"></script>
    <script src="vendor/cytoscape-fcose-2.2.0.js"></script>
</head>
<body class="no-demo">
    <!-- WASM loading overlay -->
    <div id="wasm-loading" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#1a1a2e;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px;">
        <div style="color:#00d9ff;font-family:'Rajdhani',sans-serif;font-size:1.8rem;font-weight:700;letter-spacing:0.04em;">MVD Analyzer</div>
        <div style="color:#7a8ba8;font-size:0.9rem;">Loading analyzer...</div>
        <div style="width:200px;height:3px;background:#2a3f5f;border-radius:2px;overflow:hidden;">
            <div style="width:100%;height:100%;background:#00d9ff;animation:shimmer 1.5s infinite;"></div>
        </div>
    </div>

    <!-- The shell (top bar, sidebar, layout) is src/shell/App.svelte, mounted
         here by src/main.js. -->
    <div id="app"></div>

    <!-- The tab not yet ported to Svelte (Search): app.js's markup, adopted
         into the shell's main pane (src/shell/adopt.js) before
         DOMContentLoaded. -->
    <div id="legacy-dom" hidden>

            <!-- Search Tab (first; always available even when no demo loaded) -->
            <div id="tab-search" class="tab-content active">
                <div class="panel search-load-panel">
                    <div class="load-row" id="drop-zone">
                        <input type="file" id="file-input" accept=".mvd,.mvd.gz" hidden>
                        <button class="load-file-btn" onclick="document.getElementById('file-input').click()">Load from File</button>
                        <span class="load-separator">|</span>
                        <input type="text" id="hub-input" placeholder="Game ID or hub.quakeworld.nu URL">
                        <button id="hub-load-btn" onclick="loadFromHub()">Load from Hub</button>
                    </div>
                    <div id="upload-status" class="status"></div>
                </div>
                <div class="panel search-filter-panel">
                    <form class="search-form" id="search-form" autocomplete="off">
                        <div class="search-row">
                            <label class="search-field">
                                <span>Player</span>
                                <input type="text" id="search-player" placeholder="any">
                            </label>
                            <label class="search-field">
                                <span>Team</span>
                                <input type="text" id="search-team" placeholder="any">
                            </label>
                            <label class="search-field">
                                <span>Map</span>
                                <input type="text" id="search-map" placeholder="any">
                            </label>
                            <label class="search-field">
                                <span>Mode</span>
                                <!-- Options are filled from SEARCH_MODE_LABELS in
                                     app.js (setupSearch): the facet list and the
                                     row labels are one table, not two copies that
                                     can drift. -->
                                <select id="search-mode">
                                    <option value="">Any</option>
                                </select>
                            </label>
                            <label class="search-field">
                                <span>Game tag</span>
                                <input type="text" id="search-tag" placeholder="any">
                            </label>
                            <label class="search-field search-field-date">
                                <span>From</span>
                                <input type="date" id="search-from">
                            </label>
                            <label class="search-field search-field-date">
                                <span>To</span>
                                <input type="date" id="search-to">
                            </label>
                            <button type="submit" class="search-submit" id="search-submit">Search</button>
                        </div>
                    </form>
                    <div id="search-status" class="status"></div>
                    <div id="search-results" class="search-results"></div>
                </div>
            </div>

    </div><!-- /legacy-dom -->

    <!-- src/main.js mounts the shell and publishes the ESM modules app.js
         uses on window; see the comment there. -->
    <script type="module" src="./src/main.js"></script>
    <script src="app.js"></script>
</body>
</html>
