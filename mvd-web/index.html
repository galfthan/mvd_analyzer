<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Stamped by `make build` (sed); "dev" in a local Vite build. The
         git hash, tag and date fill the version tag (src/app/overlay.js),
         which also compares the hash with the in-browser analyzer's to
         catch a stale cached bundle after a deploy; the schema is the
         Result version the page reads — a hub demo the API serves in
         another is analysed in the browser (src/data/api-source.js). -->
    <meta name="build" content="dev">
    <meta name="build-tag" content="dev">
    <meta name="build-date" content="dev">
    <meta name="schema" content="dev">
    <title>MVD Analyzer</title>
    <!-- Rajdhani + Inter, vendored from Google Fonts (see vendor/README.md). -->
    <link rel="stylesheet" href="vendor/fonts/fonts.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Cytoscape.js for the Loc Graph tab, vendored (no runtime CDN). Load
         order matters: cytoscape first, then the fcose dependency chain
         (layout-base -> cose-base -> cytoscape-fcose, each reads the
         previous one's window global). See vendor/README.md. -->
    <script src="vendor/cytoscape-3.30.2.min.js"></script>
    <script src="vendor/layout-base-2.0.1.js"></script>
    <script src="vendor/cose-base-2.2.0.js"></script>
    <script src="vendor/cytoscape-fcose-2.2.0.js"></script>
</head>
<body class="no-demo">
    <!-- Loading overlay: plain markup so it shows before any script runs;
         src/app/overlay.js drops it at once, or after a deep-linked demo. -->
    <div id="wasm-loading" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#1a1a2e;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px;">
        <div style="color:#00d9ff;font-family:'Rajdhani',sans-serif;font-size:1.8rem;font-weight:700;letter-spacing:0.04em;">MVD Analyzer</div>
        <div style="color:#7a8ba8;font-size:0.9rem;">Loading...</div>
        <div style="width:200px;height:3px;background:#2a3f5f;border-radius:2px;overflow:hidden;">
            <div style="width:100%;height:100%;background:#00d9ff;animation:shimmer 1.5s infinite;"></div>
        </div>
    </div>

    <!-- The shell (top bar, sidebar, every tab) is src/shell/App.svelte,
         mounted here by src/main.js. -->
    <div id="app"></div>

    <!-- src/main.js mounts the shell and starts the page. -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
